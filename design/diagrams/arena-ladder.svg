<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 735" role="img" aria-label="A ladder you understand; a replay you can trust"><title>A ladder you understand; a replay you can trust</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#aa9871"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif}.name{font-size:21px;fill:#f0dfba;font-weight:600}.detail{font-size:15px;fill:#b5c8c6}.tag{font-size:11px;letter-spacing:1.6px;fill:#93b6a3}.edge{font-size:12px;fill:#c5b686}</style><rect width="100%" height="100%" rx="18" fill="#101f26"/><text x="36" y="44" font-family="Georgia" font-size="29" fill="#f0dfba">A ladder you understand; a replay you can trust</text><text x="36" y="73" class="detail">Proposed local-first arena · Imported teams are exhibitions. Online ranking is a later, separate service.</text><path d="M370 176H435" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M765 176H830" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M205 237V340" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="275" y="288" text-anchor="middle" class="edge">prepare a bout</text><path d="M370 401H435" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M765 401H830" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M600 462V515H205V565" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="398" y="506" text-anchor="middle" class="edge">saved replay</text><path d="M370 626H435" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M765 626H830" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="115" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="40" y="115" width="4" height="122" rx="2" fill="#b7a16a"/><text x="58" y="139" class="tag">QUALIFICATION</text><text x="58" y="167" class="name">Three rungs per league</text><text x="58" y="195" class="detail">Each: five scoring wins, covering</text><text x="58" y="216" class="detail">three distinct rival styles.</text><rect x="435" y="115" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="435" y="115" width="4" height="122" rx="2" fill="#b7a16a"/><text x="453" y="139" class="tag">PROMOTION</text><text x="453" y="167" class="name">Challenge the champion</text><text x="453" y="195" class="detail">Player launches the important bout.</text><text x="453" y="216" class="detail">Promotion reveals a new capability.</text><rect x="830" y="115" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="830" y="115" width="4" height="122" rx="2" fill="#b7a16a"/><text x="848" y="139" class="tag">FIVE LEAGUES</text><text x="848" y="167" class="name">Work toward the crown</text><text x="848" y="195" class="detail">Bronze → iron → steel → mithril</text><text x="848" y="216" class="detail">→ starforged → Legacy charter.</text><rect x="40" y="340" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="40" y="340" width="4" height="122" rx="2" fill="#b7a16a"/><text x="58" y="364" class="tag">BEFORE THE BOUT</text><text x="58" y="392" class="name">Freeze the match</text><text x="58" y="420" class="detail">Team, gear, formation, fatigue,</text><text x="58" y="441" class="detail">rules, combat version and seed.</text><rect x="435" y="340" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="435" y="340" width="4" height="122" rx="2" fill="#b7a16a"/><text x="453" y="364" class="tag">RESOLUTION</text><text x="453" y="392" class="name">Simulate and record</text><text x="453" y="420" class="detail">Automatic front/back-line combat.</text><text x="453" y="441" class="detail">Persist the result and event log.</text><rect x="830" y="340" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="830" y="340" width="4" height="122" rx="2" fill="#b7a16a"/><text x="848" y="364" class="tag">REWARD ONCE</text><text x="848" y="392" class="name">Write the official result</text><text x="848" y="420" class="detail">Match ID prevents duplicate payouts.</text><text x="848" y="441" class="detail">Exhibitions never invent qualification.</text><rect x="40" y="565" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="40" y="565" width="4" height="122" rx="2" fill="#b7a16a"/><text x="58" y="589" class="tag">LEARNING</text><text x="58" y="617" class="name">Inspect decisive moments</text><text x="58" y="645" class="detail">Play, pause, step or speed up.</text><text x="58" y="666" class="detail">Viewing never changes the outcome.</text><rect x="435" y="565" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="435" y="565" width="4" height="122" rx="2" fill="#b7a16a"/><text x="453" y="589" class="tag">RESPONSE</text><text x="453" y="617" class="name">Pin a crafting answer</text><text x="453" y="645" class="detail">Protection? Penetration? A ward?</text><text x="453" y="666" class="detail">Compare owned gear in a sandbox.</text><rect x="830" y="565" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="830" y="565" width="4" height="122" rx="2" fill="#b7a16a"/><text x="848" y="589" class="tag">RETURN</text><text x="848" y="617" class="name">Rematch deliberately</text><text x="848" y="645" class="detail">Keep earned qualification on a loss.</text><text x="848" y="666" class="detail">Fixed challenge seeds limit reload luck.</text></svg>