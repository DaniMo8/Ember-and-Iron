<svg class="company-diagram" xmlns="http://www.w3.org/2000/svg" width="1120" height="840" viewBox="0 0 1120 840" role="img"><title>The maker and autonomous company loop, version 1.4.1</title><style>svg.company-diagram text{font-family:Segoe UI,Arial;fill:#c3d1d8}svg.company-diagram .title{font:26px Georgia;fill:#e5c88b}svg.company-diagram .label{font-size:16px;fill:#e5c88b}svg.company-diagram .small{font-size:12px}</style><rect width="100%" height="100%" rx="12" fill="#111d25"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#aa976e"/></marker></defs><text x="30" y="44" class="title">Make the equipment. Shape the company.</text><rect x="30" y="78" width="1060" height="76" rx="7" fill="#21343f" stroke="#69808c" stroke-opacity=".5"/><text x="46" y="105" class="label">CREATE A GENERATION</text><text x="46" y="129" class="small">Choose profession + 20 attributes; name and choose classes for three heroes.</text><rect x="30" y="189" width="320" height="118" rx="7" fill="#21343f" stroke="#69808c" stroke-opacity=".5"/><text x="46" y="216" class="label">MINE</text><text x="46" y="240" class="small">Assign workers to seams; coal first.</text><text x="46" y="262" class="small">Extract materials; buy wood/leather.</text><text x="46" y="284" class="small">Trade in Open workings.</text><rect x="400" y="189" width="320" height="118" rx="7" fill="#21343f" stroke="#69808c" stroke-opacity=".5"/><text x="416" y="216" class="label">FORGE</text><text x="416" y="240" class="small">Choose group, class, then tier.</text><text x="416" y="262" class="small">Training → standard → next tier.</text><text x="416" y="284" class="small">Optional high-attribute prestige gear.</text><rect x="770" y="189" width="320" height="118" rx="7" fill="#21343f" stroke="#69808c" stroke-opacity=".5"/><text x="786" y="216" class="label">SHOP</text><text x="786" y="240" class="small">Fill display slots automatically.</text><text x="786" y="262" class="small">Heroes buy useful, compatible gear.</text><text x="786" y="284" class="small">Five craftable requests; track visitors.</text><path d="M350,248 L400,248" stroke="#aa976e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M720,248 L770,248" stroke="#aa976e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M930,307 L930,345" stroke="#aa976e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="770" y="345" width="320" height="119" rx="7" fill="#21343f" stroke="#69808c" stroke-opacity=".5"/><text x="786" y="372" class="label">AUTOMATIC QUESTS</text><text x="786" y="396" class="small">Short travel; two combat rounds.</text><text x="786" y="418" class="small">Front line shields the back line.</text><text x="786" y="440" class="small">Win: one mastery count per hero.</text><rect x="400" y="345" width="320" height="119" rx="7" fill="#21343f" stroke="#69808c" stroke-opacity=".5"/><text x="416" y="372" class="label">RETURN / RECOVER</text><text x="416" y="396" class="small">Win: rewards, shopping, next journey.</text><text x="416" y="418" class="small">Lose: rest, shop for upgrades, retry.</text><text x="416" y="440" class="small">No material overflow or held returns.</text><path d="M770,407 L720,407" stroke="#aa976e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M560,345 L560,307" stroke="#aa976e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="345" width="320" height="119" rx="7" fill="#21343f" stroke="#69808c" stroke-opacity=".5"/><text x="46" y="372" class="label">SMITH &amp; INVESTMENT</text><text x="46" y="396" class="small">Gain attributes and class mastery.</text><text x="46" y="418" class="small">Give employees leave; resume duty.</text><text x="46" y="440" class="small">Room trees; six furnishings with 5 levels.</text><path d="M400,407 L350,407" stroke="#aa976e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M190,345 L190,307" stroke="#aa976e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="400" y="505" width="690" height="109" rx="7" fill="#21343f" stroke="#69808c" stroke-opacity=".5"/><text x="416" y="532" class="label">EACH TIER: LEVEL 1 → LEVEL 2 → LEVEL 3 → BOSS</text><text x="416" y="556" class="small">5 wins per level. A winning trio adds three counts; one boss clear opens the next tier.</text><text x="416" y="578" class="small">Select heroes → Gather and launch → automatic departure when ready.</text><path d="M930,464 L930,505" stroke="#aa976e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="654" width="1060" height="105" rx="7" fill="#21343f" stroke="#69808c" stroke-opacity=".5"/><text x="46" y="681" class="label">TIER 5 VOID SOVEREIGN → UNLOCK LEGACY SCREEN</text><text x="46" y="705" class="small">Retain sparks, talents, furnishings, records and one heirloom.</text><text x="46" y="727" class="small">Restart with a new chosen company. Staff and ordinary room progress reset.</text><path d="M744,614 L744,654" stroke="#aa976e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="30" y="799" class="small">One deterministic scheduler; eight offline hours; employee stamina and storage limits continue to apply.</text></svg>