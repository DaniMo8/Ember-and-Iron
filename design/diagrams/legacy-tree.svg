<svg class="company-diagram" xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img"><title>Four permanent Legacy sections, version 2.1</title><style>svg.company-diagram text{font-family:Segoe UI,Arial;fill:#c3d1d8}svg.company-diagram .title{font:26px Georgia;fill:#e5c88b}svg.company-diagram .label{font-size:16px;fill:#e5c88b}svg.company-diagram .small{font-size:12px}</style><rect width="100%" height="100%" rx="12" fill="#111d25"/><text x="30" y="44" class="title">Legacy: a workshop that remembers</text><rect x="30" y="78" width="1060" height="77" rx="7" fill="#21343f" stroke="#69808c" stroke-opacity=".5"/><text x="46" y="105" class="label">DEFEAT THE TIER 5 BOSS, THEN RETIRE</text><text x="46" y="129" class="small">46–66 sparks per full campaign; 36 talents cost 828 sparks in total.</text><rect x="30" y="180" width="515" height="180" rx="7" fill="#21343f" stroke="#69808c" stroke-opacity=".5"/><text x="46" y="207" class="label">WORKFORCE</text><text x="46" y="231" class="small">Extra starting miners: +1 / +2 / +3</text><text x="46" y="253" class="small">Costs: 12 / 28 / 60 sparks</text><text x="46" y="275" class="small">Also keeps the six Force talents.</text><rect x="575" y="180" width="515" height="180" rx="7" fill="#21343f" stroke="#69808c" stroke-opacity=".5"/><text x="591" y="207" class="label">EFFICIENCY</text><text x="591" y="231" class="small">Rank growth: 90% → 80% → 70% → 60%</text><text x="591" y="253" class="small">Costs: 16 / 36 / 72 sparks</text><text x="591" y="275" class="small">Also keeps the six Commerce talents.</text><rect x="30" y="390" width="515" height="180" rx="7" fill="#21343f" stroke="#69808c" stroke-opacity=".5"/><text x="46" y="417" class="label">METALLURGY</text><text x="46" y="441" class="small">Extra ingots per batch: +1 / +1 / +2</text><text x="46" y="463" class="small">Costs: 16 / 36 / 72 sparks</text><text x="46" y="485" class="small">Also keeps the six Artifice talents.</text><rect x="575" y="390" width="515" height="180" rx="7" fill="#21343f" stroke="#69808c" stroke-opacity=".5"/><text x="591" y="417" class="label">ARCHIVES</text><text x="591" y="441" class="small">17 rare designs → 17 legendary designs</text><text x="591" y="463" class="small">Costs: 24 / 52 / 100 sparks</text><text x="591" y="485" class="small">Final node: mastery gates −5, quality cap +10</text><rect x="30" y="603" width="1060" height="108" rx="7" fill="#21343f" stroke="#69808c" stroke-opacity=".5"/><text x="46" y="630" class="label">PERMANENT INVESTMENT, NEW GENERATIONS</text><text x="46" y="654" class="small">Starting bonuses apply once when the next smith is created. Other powers apply immediately.</text><text x="46" y="676" class="small">Metal, attributes, proficiency and quality ceilings still gate crafting. Full bins discard excess.</text></svg>