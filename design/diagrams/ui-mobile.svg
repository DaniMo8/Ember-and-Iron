<svg class="company-diagram" xmlns="http://www.w3.org/2000/svg" width="430" height="1030" viewBox="0 0 430 1030" role="img"><title>Dense mobile layout, version 2.0</title><style>svg.company-diagram text{font-family:Segoe UI,Arial;fill:#c3d1d8}svg.company-diagram .title{font:26px Georgia;fill:#e5c88b}svg.company-diagram .label{font-size:16px;fill:#e5c88b}svg.company-diagram .small{font-size:12px}</style><rect width="100%" height="100%" rx="12" fill="#111d25"/><text x="22" y="42" class="title">The same game, a narrow screen</text><rect x="20" y="70" width="390" height="82" rx="7" fill="#21343f" stroke="#69808c" stroke-opacity=".5"/><text x="36" y="97" class="label">Ember &amp; Iron       Gold / Settings</text><text x="36" y="121" class="small">Smith / Mine / Smelter / Forge</text><text x="36" y="143" class="small">Shop / Customers / Legacy</text><rect x="20" y="168" width="390" height="71" rx="7" fill="#21343f" stroke="#69808c" stroke-opacity=".5"/><text x="36" y="195" class="label">Room title          Upgrades</text><text x="36" y="219" class="small">Stage and room currency</text><rect x="20" y="255" width="390" height="93" rx="7" fill="#21343f" stroke="#69808c" stroke-opacity=".5"/><text x="36" y="282" class="label">NEXT STEP</text><text x="36" y="306" class="small">One current goal and its reason</text><text x="36" y="328" class="small">Direct action</text><rect x="20" y="365" width="390" height="88" rx="7" fill="#21343f" stroke="#69808c" stroke-opacity=".5"/><text x="36" y="392" class="label">KEY FIGURES</text><text x="36" y="416" class="small">Two compact rows of three metrics</text><rect x="20" y="470" width="390" height="156" rx="7" fill="#21343f" stroke="#69808c" stroke-opacity=".5"/><text x="36" y="497" class="label">PRIMARY WORK</text><text x="36" y="521" class="small">Recipe, material and enchantment choices</text><text x="36" y="543" class="small">Mine: assignment and mining rows</text><text x="36" y="565" class="small">Customers: fixed class unlock cards</text><text x="36" y="587" class="small">Selected hero: follow / live view / gear</text><rect x="20" y="643" width="390" height="160" rx="7" fill="#21343f" stroke="#69808c" stroke-opacity=".5"/><text x="36" y="670" class="label">CONTEXT BELOW</text><text x="36" y="694" class="small">Work queue and resources</text><text x="36" y="716" class="small">Formation rounds and quest mastery</text><text x="36" y="738" class="small">All panels scroll naturally</text><text x="36" y="760" class="small">No controls require touching artwork</text><rect x="20" y="820" width="390" height="116" rx="7" fill="#21343f" stroke="#69808c" stroke-opacity=".5"/><text x="36" y="847" class="label">UPGRADE OVERLAY</text><text x="36" y="871" class="small">Section currency and current balance</text><text x="36" y="893" class="small">Three vertically stacked upgrade paths</text><text x="36" y="915" class="small">Escape or close returns to the room</text><text x="22" y="980" class="small">Art remains a passive full-page background.</text></svg>