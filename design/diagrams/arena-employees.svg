<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 735" role="img" aria-label="People turn a busy workshop into an idle house"><title>People turn a busy workshop into an idle house</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#aa9871"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif}.name{font-size:21px;fill:#f0dfba;font-weight:600}.detail{font-size:15px;fill:#b5c8c6}.tag{font-size:11px;letter-spacing:1.6px;fill:#93b6a3}.edge{font-size:12px;fill:#c5b686}</style><rect width="100%" height="100%" rx="18" fill="#101f26"/><text x="36" y="44" font-family="Georgia" font-size="29" fill="#f0dfba">People turn a busy workshop into an idle house</text><text x="36" y="73" class="detail">Long-term proposal · The current game already has the separate room, eight specialists and twelve upgrades.</text><path d="M370 181H435" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M765 181H830" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M995 242V350" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M830 411H765" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M435 411H370" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M205 350V242" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="255" y="297" text-anchor="middle" class="edge">reinvest</text><path d="M600 472V565" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="684" y="522" text-anchor="middle" class="edge">earn the final crown</text><rect x="40" y="120" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="40" y="120" width="4" height="122" rx="2" fill="#b7a16a"/><text x="58" y="144" class="tag">NOTICE</text><text x="58" y="172" class="name">Find the bottleneck</text><text x="58" y="200" class="detail">What stops the pinned project?</text><text x="58" y="221" class="detail">Ore, metal, craft time or cash?</text><rect x="435" y="120" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="435" y="120" width="4" height="122" rx="2" fill="#b7a16a"/><text x="453" y="144" class="tag">INVEST</text><text x="453" y="172" class="name">Choose a department</text><text x="453" y="200" class="detail">Mine · Smelter · Forge · Shop.</text><text x="453" y="221" class="detail">A useful responsibility beats busywork.</text><rect x="830" y="120" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="830" y="120" width="4" height="122" rx="2" fill="#b7a16a"/><text x="848" y="144" class="tag">LEARN</text><text x="848" y="172" class="name">Complete real work</text><text x="848" y="200" class="detail">Work earns experience and expertise.</text><text x="848" y="221" class="detail">Training improves learning and output.</text><rect x="830" y="350" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="830" y="350" width="4" height="122" rx="2" fill="#b7a16a"/><text x="848" y="374" class="tag">CARE</text><text x="848" y="402" class="name">Manage a sustainable shift</text><text x="848" y="430" class="detail">Stamina affects active contribution.</text><text x="848" y="451" class="detail">Welfare improves recovery and endurance.</text><rect x="435" y="350" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="435" y="350" width="4" height="122" rx="2" fill="#b7a16a"/><text x="453" y="374" class="tag">DELEGATE</text><text x="453" y="402" class="name">Earn policy authority</text><text x="453" y="430" class="detail">Stock targets, reservations, contract</text><text x="453" y="451" class="detail">production and priority handovers.</text><rect x="40" y="350" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="40" y="350" width="4" height="122" rx="2" fill="#b7a16a"/><text x="58" y="374" class="tag">GET TIME BACK</text><text x="58" y="402" class="name">Make fewer routine visits</text><text x="58" y="430" class="detail">Review outcomes and new blockers.</text><text x="58" y="451" class="detail">Keep rare projects and bosses deliberate.</text><rect x="435" y="565" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="435" y="565" width="4" height="122" rx="2" fill="#b7a16a"/><text x="453" y="589" class="tag">LEGACY</text><text x="453" y="617" class="name">Inherit an operating method</text><text x="453" y="645" class="detail">Permanent capabilities shorten chores.</text><text x="453" y="666" class="detail">A new generation still has new choices.</text></svg>