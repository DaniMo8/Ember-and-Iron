<svg class="company-diagram" xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img"><title>Seventeen item classes and 289 patterns, version 2.1</title><style>svg.company-diagram text{font-family:Segoe UI,Arial;fill:#c3d1d8}svg.company-diagram .title{font:26px Georgia;fill:#e5c88b}svg.company-diagram .label{font-size:16px;fill:#e5c88b}svg.company-diagram .small{font-size:12px}</style><rect width="100%" height="100%" rx="12" fill="#111d25"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#aa976e"/></marker></defs><text x="30" y="44" class="title">289 patterns · 17 class masteries · 5 material tiers</text><rect x="30" y="82" width="1060" height="76" rx="7" fill="#21343f" stroke="#69808c" stroke-opacity=".5"/><text x="46" y="109" class="label">UNLOCKED CUSTOMER CLASSES DETERMINE AVAILABLE EQUIPMENT</text><text x="46" y="133" class="small">Every item records material, quality, crafted prefix, enchanted suffix and maker generation.</text><rect x="30" y="200" width="320" height="230" rx="7" fill="#21343f" stroke="#69808c" stroke-opacity=".5"/><text x="46" y="227" class="label">WEAPONS · 7 CLASSES</text><text x="46" y="251" class="small">Daggers · Swords · Axes · Maces</text><text x="46" y="273" class="small">Polearms · Bows · Arcane foci</text><text x="46" y="295" class="small">Choose class, then recipe and material.</text><text x="46" y="317" class="small">Wand / sceptre: one hand.</text><text x="46" y="339" class="small">Prestige staff: two hands.</text><rect x="400" y="200" width="320" height="230" rx="7" fill="#21343f" stroke="#69808c" stroke-opacity=".5"/><text x="416" y="227" class="label">ARMOUR · 3 CLASSES</text><text x="416" y="251" class="small">Mail: Vanguard, Breaker, Guardian</text><text x="416" y="273" class="small">Leather: Duelist, Ranger</text><text x="416" y="295" class="small">Cloth: Mage</text><text x="416" y="317" class="small">Separate mastery for each class.</text><text x="416" y="339" class="small">Higher-tier fittings improve protection.</text><rect x="770" y="200" width="320" height="230" rx="7" fill="#21343f" stroke="#69808c" stroke-opacity=".5"/><text x="786" y="227" class="label">OTHER · 7 CLASSES</text><text x="786" y="251" class="small">Offhand: Shields · Books &amp; relics</text><text x="786" y="273" class="small">Ring: Rings</text><text x="786" y="295" class="small">Charm: Charms · Talismans</text><text x="786" y="317" class="small">Tool: Tools · Instruments</text><text x="786" y="339" class="small">Compatibility varies by hero class.</text><path d="M190,158 L190,200" stroke="#aa976e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M560,158 L560,200" stroke="#aa976e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M930,158 L930,200" stroke="#aa976e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="469" width="1060" height="76" rx="7" fill="#21343f" stroke="#69808c" stroke-opacity=".5"/><text x="46" y="496" class="label">BRONZE → IRON → STEEL → MITHRIL → STARFORGED</text><text x="46" y="520" class="small">255 ordinary patterns + 34 Legacy designs. Recipes unlock in Forge; attributes and mastery still apply.</text><rect x="30" y="574" width="320" height="100" rx="7" fill="#21343f" stroke="#69808c" stroke-opacity=".5"/><text x="46" y="601" class="label">TRAINING</text><text x="46" y="625" class="small">Cheap and quick; -12 quality.</text><text x="46" y="647" class="small">Entry point into the material tier.</text><rect x="400" y="574" width="320" height="100" rx="7" fill="#21343f" stroke="#69808c" stroke-opacity=".5"/><text x="416" y="601" class="label">STANDARD</text><text x="416" y="625" class="small">Dependable all-round equipment.</text><text x="416" y="647" class="small">+4 proficiency / +1 attribute to unlock.</text><rect x="770" y="574" width="320" height="100" rx="7" fill="#21343f" stroke="#69808c" stroke-opacity=".5"/><text x="786" y="601" class="label">PRESTIGE</text><text x="786" y="625" class="small">+12 quality; 1.95× core combat stats.</text><text x="786" y="647" class="small">High requirements; optional progression.</text></svg>