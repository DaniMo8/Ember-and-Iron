<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 715" role="img" aria-label="A workshop that creates champions"><title>A workshop that creates champions</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#aa9871"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif}.name{font-size:21px;fill:#f0dfba;font-weight:600}.detail{font-size:15px;fill:#b5c8c6}.tag{font-size:11px;letter-spacing:1.6px;fill:#93b6a3}.edge{font-size:12px;fill:#c5b686}</style><rect width="100%" height="100%" rx="18" fill="#101f26"/><text x="36" y="44" font-family="Georgia" font-size="29" fill="#f0dfba">A workshop that creates champions</text><text x="36" y="73" class="detail">Proposed main loop · Contracts pay for the house. Equipment wins its reputation.</text><path d="M370 181H435" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M765 181H830" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M995 242V335" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M830 396H765" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M435 396H370" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M205 457V550" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M370 611H435" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="402" y="599" text-anchor="middle" class="edge">victory</text><path d="M765 611H830" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1160 611H1180V101H205V120" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="606" y="101" text-anchor="middle" class="edge">repeat with a new goal</text><path d="M40 611H20V181H40" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="120" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="40" y="120" width="4" height="122" rx="2" fill="#b7a16a"/><text x="58" y="144" class="tag">01 · PURPOSE</text><text x="58" y="172" class="name">Read the rival</text><text x="58" y="200" class="detail">See a tactic and a weakness.</text><text x="58" y="221" class="detail">Pin one answer to build.</text><rect x="435" y="120" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="435" y="120" width="4" height="122" rx="2" fill="#b7a16a"/><text x="453" y="144" class="tag">02 · PLAN</text><text x="453" y="172" class="name">Fund the project</text><text x="453" y="200" class="detail">Contracts provide steady gold.</text><text x="453" y="221" class="detail">Reserve supplies for the team.</text><rect x="830" y="120" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="830" y="120" width="4" height="122" rx="2" fill="#b7a16a"/><text x="848" y="144" class="tag">03 · PRODUCE</text><text x="848" y="172" class="name">Mine → Smelter</text><text x="848" y="200" class="detail">Choose ore targets and alloy.</text><text x="848" y="221" class="detail">Employees manage repeat work.</text><rect x="830" y="335" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="830" y="335" width="4" height="122" rx="2" fill="#b7a16a"/><text x="848" y="359" class="tag">04 · CRAFT</text><text x="848" y="387" class="name">Make a deliberate piece</text><text x="848" y="415" class="detail">Pattern + material + treatment.</text><text x="848" y="436" class="detail">Finish or enchant for its purpose.</text><rect x="435" y="335" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="435" y="335" width="4" height="122" rx="2" fill="#b7a16a"/><text x="453" y="359" class="tag">05 · ALLOCATE</text><text x="453" y="387" class="name">Shop &amp; Armoury</text><text x="453" y="415" class="detail">Keep team gear; deliver contracts.</text><text x="453" y="436" class="detail">Practice stock has a clear outlet.</text><rect x="40" y="335" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="40" y="335" width="4" height="122" rx="2" fill="#b7a16a"/><text x="58" y="359" class="tag">06 · PROVE</text><text x="58" y="387" class="name">Enter the arena</text><text x="58" y="415" class="detail">Pick three fighters and a doctrine.</text><text x="58" y="436" class="detail">Automatic combat tests the build.</text><rect x="40" y="550" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="40" y="550" width="4" height="122" rx="2" fill="#b7a16a"/><text x="58" y="574" class="tag">07 · LEARN</text><text x="58" y="602" class="name">Replay the turning point</text><text x="58" y="630" class="detail">Understand the loss or victory.</text><text x="58" y="651" class="detail">Choose the next improvement.</text><rect x="435" y="550" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="435" y="550" width="4" height="122" rx="2" fill="#b7a16a"/><text x="453" y="574" class="tag">08 · ADVANCE</text><text x="453" y="602" class="name">Qualify and promote</text><text x="453" y="630" class="detail">Three rungs → league champion.</text><text x="453" y="651" class="detail">New licences and first-clear prizes.</text><rect x="830" y="550" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="830" y="550" width="4" height="122" rx="2" fill="#b7a16a"/><text x="848" y="574" class="tag">09 · TRANSFORM</text><text x="848" y="602" class="name">Grow the smithing house</text><text x="848" y="630" class="detail">New material, person or capability.</text><text x="848" y="651" class="detail">Final crown opens Legacy choices.</text></svg>