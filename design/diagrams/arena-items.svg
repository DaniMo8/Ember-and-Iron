<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 735" role="img" aria-label="The life of a house-made weapon"><title>The life of a house-made weapon</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#aa9871"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif}.name{font-size:21px;fill:#f0dfba;font-weight:600}.detail{font-size:15px;fill:#b5c8c6}.tag{font-size:11px;letter-spacing:1.6px;fill:#93b6a3}.edge{font-size:12px;fill:#c5b686}</style><rect width="100%" height="100%" rx="18" fill="#101f26"/><text x="36" y="44" font-family="Georgia" font-size="29" fill="#f0dfba">The life of a house-made weapon</text><text x="36" y="73" class="detail">Proposed item progression · Power comes from making; history comes from using.</text><path d="M370 176H435" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M765 176H830" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M995 237V285H205V340" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="600" y="277" text-anchor="middle" class="edge">allocate finished work</text><path d="M600 285V340" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M995 285V340" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M205 462V565" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M370 626H435" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M765 626H830" stroke="#aa9871" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="115" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="40" y="115" width="4" height="122" rx="2" fill="#b7a16a"/><text x="58" y="139" class="tag">INTENT</text><text x="58" y="167" class="name">Choose the work mode</text><text x="58" y="195" class="detail">Team commission · catalogue order</text><text x="58" y="216" class="detail">or explicit mastery practice.</text><rect x="435" y="115" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="435" y="115" width="4" height="122" rx="2" fill="#b7a16a"/><text x="453" y="139" class="tag">MATERIAL</text><text x="453" y="167" class="name">Select the design</text><text x="453" y="195" class="detail">Class pattern + material treatment.</text><text x="453" y="216" class="detail">Training → standard → prestige.</text><rect x="830" y="115" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="830" y="115" width="4" height="122" rx="2" fill="#b7a16a"/><text x="848" y="139" class="tag">MAKING</text><text x="848" y="167" class="name">Forge the piece</text><text x="848" y="195" class="detail">Crafted prefix + chosen suffix.</text><text x="848" y="216" class="detail">Diminishing finishing costs time.</text><rect x="40" y="340" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="40" y="340" width="4" height="122" rx="2" fill="#b7a16a"/><text x="58" y="364" class="tag">KEEP</text><text x="58" y="392" class="name">Equip and protect</text><text x="58" y="420" class="detail">Compare the complete loadout.</text><text x="58" y="441" class="detail">Team reservations beat auto-sale.</text><rect x="435" y="340" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="435" y="340" width="4" height="122" rx="2" fill="#b7a16a"/><text x="453" y="364" class="tag">SELL</text><text x="453" y="392" class="name">Deliver a contract</text><text x="453" y="420" class="detail">Known quantity, quality and payout.</text><text x="453" y="441" class="detail">Catalogue income funds experiments.</text><rect x="830" y="340" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="830" y="340" width="4" height="122" rx="2" fill="#b7a16a"/><text x="848" y="364" class="tag">LEARN</text><text x="848" y="392" class="name">Practice and clear</text><text x="848" y="420" class="detail">Show mastery gained and net cost.</text><text x="848" y="441" class="detail">Never promise profitable salvage.</text><rect x="40" y="565" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="40" y="565" width="4" height="122" rx="2" fill="#b7a16a"/><text x="58" y="589" class="tag">REMEMBER</text><text x="58" y="617" class="name">Win a named bout</text><text x="58" y="645" class="detail">Record the piece’s combat history.</text><text x="58" y="666" class="detail">A hallmark can inspire commissions.</text><rect x="435" y="565" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="435" y="565" width="4" height="122" rx="2" fill="#b7a16a"/><text x="453" y="589" class="tag">REUSE</text><text x="453" y="617" class="name">Replace with purpose</text><text x="453" y="645" class="detail">Refit it or equip a reserve fighter.</text><text x="453" y="666" class="detail">Protect a favourite as a trophy.</text><rect x="830" y="565" width="330" height="122" rx="10" fill="#20363c" stroke="#758576" stroke-opacity=".7"/><rect x="830" y="565" width="4" height="122" rx="2" fill="#b7a16a"/><text x="848" y="589" class="tag">INHERIT OR RECYCLE</text><text x="848" y="617" class="name">Give the piece an ending</text><text x="848" y="645" class="detail">One declared heirloom crosses Legacy.</text><text x="848" y="666" class="detail">Salvage returns only part of its inputs.</text></svg>