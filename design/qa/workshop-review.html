<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workshop review</title><body style="background:#13202a;color:#eee;font:18px system-ui;padding:24px"><h1>Workshop review</h1><p>Disposable fixtures restricted to port 8791.</p><button data-mode="fresh">New smith</button> <button data-mode="opening">Opening workshop</button> <button data-mode="advanced">Crafting review</button><p id="result"></p>
<script src="../../data.js"></script><script src="../../engine.js"></script><script src="../../campaign.js"></script><script src="../../company.js"></script><script src="../../formation-combat.js"></script><script src="../../progression.js"></script><script src="../../world-engine.js"></script><script src="../../workshop.js"></script><script src="../../workshop-engine.js"></script>
<script>for(const button of document.querySelectorAll('button'))button.onclick=()=>{try{if(location.port!=='8791')throw Error('Use the isolated review port.');const e=new EIWorkshopEngine(EIData);if(button.dataset.mode!=='fresh'){e.command('create',{smithName:'Rowan',name:'The Copper Hearth',stats:{strength:5,precision:5,charisma:5,knowledge:5}});}if(button.dataset.mode==='advanced'){const s=e.state;s.player.level=12;s.player.gold=10000;s.player.reputation=100;s.player.stats={strength:40,precision:40,charisma:40,knowledge:40};s.stats.questsLost=28;for(const p of Object.values(s.player.proficiency))p.level=45;for(const id of Object.keys(s.materials))s.materials[id]=30;for(const id of ['iron','steel','mithril','starforged'])s.workshop.upgrades[id]=1;for(let n=0;n<=3;n++)s.world.trees['forge_machinery_'+n]=1;s.unlocks.recipes=Object.keys(e.data.recipes);s.nextNpcAt=100000000;for(const h of s.adventurers){h.browseUntil=100000000;h.nextShopAt=100000000;}}
e.markSaved(Date.now());const v=EIWorkshopEngine.validateSave(e.exportSave(),e.data);if(!v.ok)throw Error(v.message);localStorage.setItem('ember-iron-save-v3',e.exportSave());localStorage.removeItem('ember-iron-save-v3-backup');localStorage.removeItem('ember-iron-save-v3-owner');location.href='../../index.html';}catch(error){document.querySelector('#result').textContent=error.message;}};</script></body></html>
