<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />
  <title>Original room score checks</title>
  <style>
    body {
      background: #142129;
      color: #eee;
      font: 16px system-ui;
      max-width: 900px;
      margin: 30px auto;
      padding: 16px;
    }
    button,
    select {
      font: inherit;
      padding: 12px;
      margin: 8px;
    }
    pre {
      white-space: pre-wrap;
    }
    canvas {
      max-width: 100%;
      background: #0b151c;
    }
    textarea {
      width: 100%;
      height: 50px;
    }
  </style>
  <h1>Original room score checks</h1>
  <p>
    Render the actual sound engine into audio buffers. No game save is read or
    written.
  </p>
  <button id="run">Render and verify all eight rooms</button>
  <button id="lifecycle">Check transitions and suspension</button>
  <pre id="lifecycle-results">Playback checks ready</pre>
  <pre id="results">Ready</pre>
  <canvas width="900" height="200" aria-label="Room theme waveform"></canvas>
  <select aria-label="Theme to audition" id="room"></select
  ><button id="play">Audition room</button
  ><button id="stop">Stop</button>
  <p id="state" role="status"></p>
  <audio controls></audio>
  <details>
    <summary>Rendered WAV for authoring review</summary>
    <textarea readonly aria-label="Rendered audio WAV"></textarea>
  </details>
  <script src="../../house-audio.js"></script>
  <script>
    const player = new EIHouseAudio.Soundscape(),
      results = document.querySelector("#results"),
      buffers = {};
    document.querySelector("#room").innerHTML = Object.entries(
      EIHouseAudio.themes,
    )
      .map(([id, t]) => `<option value="${id}">${id} — ${t.title}</option>`)
      .join("");
    function metrics(buffer) {
      let peak = 0,
        sum = 0,
        finite = true;
      const data = buffer.getChannelData(0);
      for (const v of data) {
        peak = Math.max(peak, Math.abs(v));
        sum += v * v;
        finite &&= Number.isFinite(v);
      }
      return {
        peak: +peak.toFixed(5),
        rms: +Math.sqrt(sum / data.length).toFixed(5),
        finite,
      };
    }
    function wav(buffer) {
      const samples = buffer.length,
        n = samples * 2,
        bytes = new ArrayBuffer(44 + n),
        v = new DataView(bytes);
      const text = (offset, s) => {
        for (let i = 0; i < s.length; i++)
          v.setUint8(offset + i, s.charCodeAt(i));
      };
      text(0, "RIFF");
      v.setUint32(4, 36 + n, true);
      text(8, "WAVEfmt ");
      v.setUint32(16, 16, true);
      v.setUint16(20, 1, true);
      v.setUint16(22, 1, true);
      v.setUint32(24, buffer.sampleRate, true);
      v.setUint32(28, buffer.sampleRate * 2, true);
      v.setUint16(32, 2, true);
      v.setUint16(34, 16, true);
      text(36, "data");
      v.setUint32(40, n, true);
      const d = buffer.getChannelData(0);
      for (let i = 0; i < samples; i++)
        v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, d[i])) * 32767, true);
      return new Uint8Array(bytes);
    }
    document.querySelector("#run").onclick = async () => {
      results.textContent = "Rendering…";
      const report = [];
      try {
        for (const room of Object.keys(EIHouseAudio.themes)) {
          const b = await EIHouseAudio.renderPreview(room, 18);
          buffers[room] = b;
          const m = metrics(b);
          report.push({
            room,
            ...m,
            pass: m.finite && m.peak < 0.95 && m.rms > 0.0005,
          });
          results.textContent = JSON.stringify(report, null, 2);
        }
        for (const settings of [
          { muted: true },
          { master: 0 },
          { music: 0, effects: 0 },
        ]) {
          const m = metrics(
            await EIHouseAudio.renderPreview("forge", 3, settings),
          );
          report.push({ settings, ...m, pass: m.peak === 0 });
        }
        const music = metrics(
            await EIHouseAudio.renderPreview("mine", 3, { effects: 0 }),
          ),
          effects = metrics(
            await EIHouseAudio.renderPreview("mine", 3, { music: 0 }),
          );
        report.push({
          separateBuses: true,
          music,
          effects,
          pass: music.rms > 0 && effects.rms > 0,
        });
        results.textContent = JSON.stringify(report, null, 2);
        const b = buffers.forge,
          data = b.getChannelData(0),
          canvas = document.querySelector("canvas"),
          ctx = canvas.getContext("2d");
        ctx.strokeStyle = "#dab879";
        ctx.beginPath();
        for (let x = 0; x < 900; x++) {
          const y = 100 + data[Math.floor((x * data.length) / 900)] * 700;
          if (!x) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
        const bytes = wav(b),
          blob = new Blob([bytes], { type: "audio/wav" });
        document.querySelector("audio").src = URL.createObjectURL(blob);
        let binary = "";
        for (let i = 0; i < bytes.length; i += 8192)
          binary += String.fromCharCode(...bytes.subarray(i, i + 8192));
        document.querySelector("textarea").value = btoa(binary);
      } catch (error) {
        results.textContent += "\nFAIL " + error.stack;
      }
    };
    document.querySelector("#play").onclick = async () => {
      player.setRoom(document.querySelector("#room").value);
      const ok = await player.unlock();
      document.querySelector("#state").textContent = ok
        ? "Playing " + EIHouseAudio.themes[player.room].title
        : "Audio unavailable";
    };
    document.querySelector("#lifecycle").onclick = async () => {
      const output = document.querySelector("#lifecycle-results"),
        retired = [];
      output.textContent = "Checking playback…";
      const pause = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      try {
        if (!(await player.unlock()))
          throw Error("Could not start browser audio");
        for (const room of Object.keys(EIHouseAudio.themes)) {
          const old = player.layer;
          player.setRoom(room);
          if (old !== player.layer) retired.push(old);
          player.effect("hammer");
          await pause(120);
        }
        await pause(1800);
        const cleaned = retired.every((layer) => layer.sources.size === 0);
        player.setVisible(false);
        await pause(120);
        const suspended = player.context.state === "suspended";
        player.setVisible(true);
        await pause(120);
        const resumed = player.context.state === "running";
        const last = player.layer;
        player.stop();
        await pause(120);
        const stopped =
          player.timer === null &&
          player.layer === null &&
          last.sources.size === 0 &&
          player.context.state === "suspended";
        output.textContent = JSON.stringify(
          {
            cleaned,
            suspended,
            resumed,
            stopped,
            pass: cleaned && suspended && resumed && stopped,
          },
          null,
          2,
        );
      } catch (error) {
        output.textContent = "FAIL " + error.stack;
      }
    };
    document.querySelector("#stop").onclick = () => {
      player.stop();
      document.querySelector("#state").textContent = "Stopped";
    };
    document.addEventListener("visibilitychange", () =>
      player.setVisible(!document.hidden),
    );
    window.addEventListener("pagehide", () => player.stop());
  </script>
</html>
