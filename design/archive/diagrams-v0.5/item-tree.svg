<tspan x="1052" dy="0">Vanguard · reliable front line</tspan>
<tspan x="1052" dy="27">Duelist · speed and precision</tspan>
<tspan x="1052" dy="27">Breaker · heavy offense</tspan>
<tspan x="1052" dy="27">Ranger · ranged pressure</tspan>
<tspan x="1052" dy="27">Guardian · protection and control</tspan>
<tspan x="1052" dy="27">Mage · elemental power</tspan>
<tspan x="1052" dy="27"></tspan>
<tspan x="1052" dy="27">Stock and compatibility shape arrivals.</tspan>
<tspan x="1052" dy="27">Party roles complement equipment.</tspan>
</text>
