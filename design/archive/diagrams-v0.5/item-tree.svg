<title id="title">Ember and Iron — full item category tree</title><desc id="desc">Twelve proficiencies and sixty core recipes across bronze, iron, steel, mithril and starforged tiers. Six adventurer archetypes use the equipment. Quality, rarity, affixes, enchantments and requirements are separate attributes.</desc>
