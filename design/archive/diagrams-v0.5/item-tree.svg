<tspan x="65" dy="0">EMBER &amp; IRON</tspan>
</text>
<text x="65" y="101" font-size="33" font-weight="700" fill="#292823" style="fill:#292823" text-anchor="start">
<tspan x="65" dy="0">Twelve crafts, six kinds of adventurer</tspan>
</text>
<text x="65" y="136" font-size="18" font-weight="400" fill="#66645c" style="fill:#66645c" text-anchor="start">
<tspan x="65" dy="0">Category defines the craft; material, quality and rarity describe the individual item.</tspan>
</text>
