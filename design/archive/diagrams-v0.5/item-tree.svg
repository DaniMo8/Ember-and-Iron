<tspan x="94" dy="0">SEPARATE ITEM ATTRIBUTES · NOT A SINGLE UPGRADE LADDER</tspan>
</text>
<text x="94" y="1250" font-size="18" font-weight="400" fill="#66645c" style="fill:#66645c" text-anchor="start">
<tspan x="94" dy="0">Materials: bronze / iron / steel / mithril / starforged</tspan>
<tspan x="94" dy="36">Five material variants per class: 60 core recipes</tspan>
<tspan x="94" dy="36">Quality: workmanship scored from 0 to 100</tspan>
<tspan x="94" dy="36">Rarity: common / uncommon / rare / epic / legendary</tspan>
<tspan x="94" dy="36">Provenance: maker, owner and notable exploits</tspan>
</text>
<text x="820" y="1250" font-size="18" font-weight="400" fill="#66645c" style="fill:#66645c" text-anchor="start">
<tspan x="820" dy="0">Affixes: item modifiers with explicit effects</tspan>
<tspan x="820" dy="36">Enchantment: separately applied magical effects</tspan>
<tspan x="820" dy="36">Requirements: stats + proficiency + station</tspan>
<tspan x="820" dy="36">Discovery gates: recipe and/or quest milestone</tspan>
<tspan x="820" dy="36">Collections preserve discovery and masterwork records.</tspan>
</text>
<text x="70" y="1528" font-size="16" font-weight="400" fill="#66645c" style="fill:#66645c" text-anchor="start">
<tspan x="70" dy="0">Amber nodes: all twelve proficiency classes      Paper nodes: equipment variants or supporting rules      Full scope · v0.5</tspan>
