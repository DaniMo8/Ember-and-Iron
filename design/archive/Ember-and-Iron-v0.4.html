  function customer(){const s=game.state,heroes=s.adventurers.filter(h=>['browsing','ready','recovering'].includes(h.status)).slice(0,3);return `<section class="panel customer-card"><div class="section-head"><h3>At your counter</h3><span class="pill">${heroes.filter(h=>h.status!=='recovering').length} browsing</span></div>${heroes.length?heroes.map(h=>`<button class="customer-row" data-action="hero" data-id="${h.id}"><span class="portrait">${portrait(h.archetypeId)}</span><span class="customer-info"><b>${esc(h.name)} <small>${esc(D.archetypes[h.archetypeId]?.name)}</small></b><span>${h.status==='recovering'?'Resting after a rough adventure':esc(h.shoppingReason||'Looking for a useful upgrade')}</span><small>${h.status==='recovering'?'Will be back when recovered':(D.archetypes[h.archetypeId]?.preferences||[]).slice(0,2).map(className).join(' & ')}</small></span><span class="customer-budget">${h.budget}g</span></button>`).join(''):`<div class="empty-state">${art('people',36)}<p>They’ll be back with stories.<br>Make a little stock while you wait.</p></div>`}<div class="counter-foot">Customers shop, form parties and adventure on their own.</div></section>`;}

  function battleCard(){const s=game.state,run=activeRun();if(run)UI.selectedRun=run.id;return `<section class="panel adventure-window"><div class="window-chrome"><span class="window-dots"><i></i><i></i><i></i></span><b>ADVENTURE WINDOW</b><span class="pill ${run&&run.status!=='complete'?'live':''}">${run?run.status==='complete'?'STORY':'LIVE':'PEACEFUL'}</span></div>${scene('battle',run?'data-run="'+run.id+'"':'')}${run?`<div class="adventure-caption"><span class="eyebrow">${esc(D.regions.find(r=>r.id===D.quests[run.questId]?.regionId)?.name||'The frontier')}</span><h3>${esc(D.quests[run.questId]?.name)}</h3>${s.runs.length>1?`<select aria-label="Watched adventure" data-input="watchedRun"><option value="auto" ${!UI.watchPinned?'selected':''}>Follow current adventures</option>${s.runs.slice(-12).reverse().map(r=>`<option value="${r.id}" ${UI.watchPinned&&r.id===run.id?'selected':''}>${esc((r.heroIds||[]).map(id=>s.adventurers.find(h=>h.id===id)?.name||id).join(' & '))} · ${esc(D.quests[r.questId]?.name)} · ${title(r.status)}</option>`).join('')}</select>`:''}</div><div data-battle-view="${run.id}"></div>${btn('Watch adventure','battle',run.id,{class:'full watch-button',icon:'map'})}`:`<div class="adventure-caption"><span class="eyebrow">SOMEWHERE BEYOND THE TREES</span><h3>A story is about to begin.</h3><p>Your customers choose their own quests. Stock their next favourite weapon, then watch it make a difference.</p></div>`}<div class="watch-foot">${icon('anvil')} Your forge keeps working while you watch.</div></section>`;}

  function quarry(){return villageDashboard('quarry');}
  function quarryWorkbench(){const s=game.state,qd=game.quarryDerived(),d=D.quarry,workers=UI.quarryTab==='workers',list=values(workers?d.workers:d.upgrades);return `<section class="panel quarry-panel"><div class="section-head"><div><span class="eyebrow">A LITTLE DUST, A LOT OF POSSIBILITY</span><h2>The old quarry</h2></div><span class="pill">Depth ${s.quarry.upgrades.depth||0}</span></div>
      <div class="quarry-feature">${scene('quarry')}<div class="mine-summary"><h3>${esc(materialName(s.quarry.activeDeposit))} workings</h3><p>${qd.yield} stock every ${time(qd.seconds*1000)}</p><div class="row spread tiny"><span>Next haul</span><b data-quarry-time>${time(s.quarry.nextYieldAt-s.simTime)}</b></div>${meter(qd.progress*100,'blue','data-quarry-progress')}<p class="tiny muted">${esc(qd.pausedReason||'Your workers keep gathering while you craft.')}</p></div></div>
      <div class="quarry-control"><label class="field">Working deposit<select aria-label="Active quarry deposit" data-input="deposit">${qd.availableDeposits.map(x=>`<option value="${x.materialId}" ${x.materialId===s.quarry.activeDeposit?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>${btn('Mine bronze','mine','bronze',{class:'primary',icon:'mine',disabled:!qd.manualReady,extra:'data-mine-button'})}${btn('Gather fuel','mine','fuel',{disabled:!qd.manualReady,extra:'data-mine-button'})}</div>
      <div class="chip-tabs">${[['upgrades','Quarry upgrades'],['workers','Hire a helping hand']].map(([id,name])=>`<button data-action="quarry-tab" data-id="${id}" class="${UI.quarryTab===id?'active':''}">${name}</button>`).join('')}</div><div class="grid-2">${list.filter(x=>!(/requirement/i.test(game.quarryPreview(x.id,workers?'worker':'upgrade').reason))).map(x=>{const p=game.quarryPreview(x.id,workers?'worker':'upgrade');return `<section class="upgrade-card mini-upgrade">${art(workers?'people':'mine',34)}<div><h3>${esc(x.name)}</h3><p>${esc(x.description)}</p><span class="tiny muted">Rank ${p.level} / ${p.maxLevel}</span></div>${btn((workers?'Hire':'Improve')+' · '+p.cost+'g',workers?'quarry-worker':'quarry-upgrade',x.id,{class:'small',disabled:!p.eligible})}</section>`;}).join('')}</div><p class="catalogue-foot">Deeper workings and specialist workers appear as your smith grows.</p></section>`;}

  function inventory(){return villageDashboard('shop');}
  function shelfTile(item){const r=D.recipes[item.recipeId];return `<button class="shelf-tile ${item.protected?'keepsake':''}" data-action="item" data-id="${item.id}"><span class="shelf-quality">Q${item.quality}</span>${art(r.classId,52)}<b>${esc(r.name)}</b><span>${item.protected?'♥ Safely kept':num(game.itemPrice(item.id))+'g'}</span></button>`;}
  function shopShelves(){const s=game.state,d=game.derived(),stock=s.inventory.filter(i=>i.displayed),stored=s.inventory.filter(i=>!i.displayed),empty=Math.max(0,d.displayCapacity-stock.length);return `<section class="panel shop-panel"><div class="section-head"><div><span class="eyebrow">GOOD THINGS, MADE BY HAND</span><h2>On your shelves</h2></div>${btn('Fill empty shelves','fill-shelves','',{class:'small primary',disabled:!empty||!stored.some(i=>!i.protected&&!i.reservedFor)})}</div><p class="section-intro">Set your work out. Customers buy what suits them and put it to the test.</p><div class="shelves"><div class="shelf-grid">${stock.map(shelfTile).join('')}${Array.from({length:Math.min(12,empty)},()=>`<button class="shelf-tile empty" data-action="stock-room" aria-label="Fill an empty display place">${icon('plus')}<b>Room for a<br>new favourite</b></button>`).join('')}</div></div><div class="row spread shelf-summary"><span>${stock.length} / ${d.displayCapacity} display places filled</span><span>${s.stats.sold} pieces found a home</span></div>
      <div class="section-head storage-head"><h3>In the stockroom <span class="muted">${stored.length}</span></h3><span class="tiny muted">${s.inventory.length} / ${d.storageCapacity} total</span></div><div class="stored-items">${stored.length?stored.map(i=>`<div class="stored-item">${art(D.recipes[i.recipeId].classId,32)}<div><b>${esc(itemName(i))}</b><small>${grade(i.quality)} · Q${i.quality}${i.protected?' · Keepsake':''}</small></div>${btn(i.protected?'Inspect':'Put on shelf',i.protected?'item':'display',i.id,{class:'small',disabled:!i.protected&&!empty})}</div>`).join(''):'<p class="small muted">All your work is out in the world. New pieces fill spare display places automatically.</p>'}</div>${s.mailbox.length?`<div class="hint-box">A delivery is waiting for you. ${btn('Open deliveries · '+s.mailbox.length,'mailbox','',{class:'small'})}</div>`:''}</section>${commissions()}`;}

  function marketItems(ids){return `<div class="market-grid">${ids.filter(id=>D.materials[id]&&(game.materialAvailable(id)||game.state.materials[id]>0)).map(id=>{const m=D.materials[id],cost=game.materialPrice(id),available=game.materialAvailable(id),held=game.state.materials[id]||0,qty=Math.min(5,held);return `<div class="market-item"><div class="row spread"><h3>${esc(m.name)}</h3><span class="tiny muted">${num(held)} held</span></div><span class="tiny muted">${Number.isFinite(cost)?available?num(cost)+' gold per unit':'Supplier locked · advance your smith or quests':'Found through exploration'}</span><div class="row">${btn('Buy 1','material',id,{class:'small',disabled:!available||player().gold<cost,extra:'data-quantity="1"'})}${btn('Buy 5','material',id,{class:'small',disabled:!available||player().gold<cost*5,extra:'data-quantity="5"'})}${Number.isFinite(m.price)&&qty?btn('Sell '+qty+' · '+Math.max(1,Math.floor(m.price*qty*.5))+' g','sell-material',id,{class:'small subtle',extra:'data-quantity="'+qty+'"'}):''}</div></div>`;}).join('')}</div>`;}
  function itemName(i){const r=D.recipes[i.recipeId];return `${i.affixId?D.affixes[i.affixId]?.name+' ':''}${r?.name||'Unknown item'}${i.enchantmentId?' · '+(D.enchantments[i.enchantmentId]?.name||'Enchanted'):''}`;}
  function combatDetails(stats,twoHanded){const labels={attack:'Attack',health:'Health',armor:'Armor',interval:'Attack interval',crit:'Critical chance',evasion:'Evasion',block:'Block chance',armorPen:'Armor penetration',lifesteal:'Lifesteal'};return `<div class="gear-tags">${Object.entries(stats).filter(([k,v])=>labels[k]&&Number.isFinite(v)&&v!==0).map(([k,v])=>`<span>${labels[k]}: ${['crit','evasion','block','lifesteal'].includes(k)?Math.round(v*100)+'%':Number(v).toFixed(1)+(k==='interval'?'s':'')}</span>`).join('')}${stats.damageType?`<span>${esc(title(stats.damageType))} damage</span>`:''}${twoHanded?'<span>Two-handed · blocks offhand</span>':''}${Object.entries(stats.resistances||{}).filter(([,v])=>v>0).map(([k,v])=>`<span>${esc(title(k))} resistance: ${Math.round(v*100)}%</span>`).join('')}</div>`;}
  function commissions(){const s=game.state,orders=s.commissions||[];return `<section class="panel commission-ledger"><div class="section-head"><div><span class="eyebrow">MADE FOR SOMEONE SPECIAL</span><h3>Little requests</h3></div>${art('book',27)}</div>${orders.filter(c=>c.status!=='complete').length?orders.filter(c=>c.status!=='complete').slice(-5).map(c=>{const h=s.adventurers.find(x=>x.id===c.heroId);return `<div class="commission-note"><b>${esc(h?.name)} · ${esc(c.name)}</b><p>${className(c.classId)} · Tier ${c.minTier}+ · Quality ${c.minQuality}+</p><small>${Math.round((c.premium-1)*100)}% extra + ${c.bonusGold}g · Put a matching piece on a shelf.</small></div>`;}).join(''):'<p class="small muted">As customers learn to trust your work, they’ll leave requests for a piece of their own. They collect matching displayed work automatically.</p>'}${orders.some(c=>c.status==='complete')?`<p class="tiny good" style="margin-top:12px">${orders.filter(c=>c.status==='complete').length} special requests fulfilled ♥</p>`:''}</section>`;}

  function effectList(effects){const labels={quality:'quality',heavyQuality:'heavy quality',speed:'craft speed',capacity:'item capacity',materialCapacity:'material capacity',queue:'queue slots',lanes:'production lanes',display:'display slots',partySize:'party members',expeditions:'expedition slots',arrival:'arrival rate',sale:'sale value',budget:'customer budget',staffDiscount:'staff discount',materialDiscount:'supply discount',proficiencyXp:'proficiency XP',heroXp:'adventurer XP',loot:'quest loot',proficiencyGateReduction:'proficiency gate reduction',affixChance:'affix chance',enchant:'enchantment strength',attack:'item attack',heirloomCombat:'heirloom power',partySynergy:'party synergy',startStrength:'starting Strength',startGold:'starting gold',startProficiency:'starting proficiency',yield:'extraction yield',automation:'automation access',enchanting:'enchanting access'};return `<div class="effect-list">${Object.entries(effects||{}).filter(([k,v])=>typeof v==='number'&&v!==0).map(([k,v])=>`<span>+${Math.abs(v)<1?Math.round(v*100)+'%':v} ${esc(labels[k]||title(k))}</span>`).join('')}</div>`;}
  function adventurers(){const s=game.state;return head('THE REGULARS','Familiar faces. Faraway places.','They shop, choose their quests and find their way home. Your craft makes their stories possible.')+`<div class="customer-page"><div class="grid-2">${s.adventurers.map(h=>{const hs=game.heroStats(h.id)||{},a=D.archetypes[h.archetypeId];return `<article class="panel hero-card"><div class="person"><span class="portrait large">${portrait(h.archetypeId)}</span><div><h3>${esc(h.name)}</h3><small>${esc(a.name)} · Level ${h.level}</small></div><span class="pill ${['ready','browsing'].includes(h.status)?'live':''}">${esc(title(h.status))}</span></div><p class="small muted">${esc(h.shoppingReason||'Always happy to find something made with care.')}</p><div class="item-values"><div><span>Health</span><b>${num(hs.health)}</b></div><div><span>Attack</span><b>${Number(hs.attack||0).toFixed(1)}</b></div><div><span>Armor</span><b>${Number(hs.armor||0).toFixed(1)}</b></div></div><div class="detail-line"><span>Current story</span><b>${esc(D.quests[h.questId]?.name||'A quiet day')}</b></div><div class="detail-line"><span>Trust in your work</span><span>${h.relationship} ♥</span></div>${h.status==='recovering'?`<p class="small bad" data-rest="${h.id}">Resting for ${time(h.recoverUntil-s.simTime)}. Then back for better gear.</p>`:''}<div class="gear-tags">${Object.entries(h.equipment||{}).filter(([,i])=>i).map(([slot,i])=>`<span>${esc(D.recipes[i.recipeId]?.name||'Worn gear')} · Q${i.quality}</span>`).join('')||'<span>Starting out with worn gear</span>'}</div>${btn('Read their story','hero',h.id,{class:'small subtle',icon:'book'})}</article>`;}).join('')||'<section class="panel empty-state">Your first visitors are on their way.</section>'}</div><aside>${battleCard()}${commissions()}</aside></div>`;}

  function expeditions(){const s=game.state,quests=values(D.quests).filter(q=>s.unlocks.quests.includes(q.id));return head('THE ADVENTURE JOURNAL','A whole world beyond your doorstep.','Customers decide where to go. Better stocked shelves help them come home with better stories.')+`<div class="adventure-page"><div>${battleCard()}</div><div class="stack">${D.regions.filter(region=>quests.some(q=>q.regionId===region.id)).map(region=>`<section class="panel region-card"><span class="eyebrow">DISCOVERED REGION</span><h2>${esc(region.name)}</h2><p class="small muted">${esc(region.description)}</p>${quests.filter(q=>q.regionId===region.id).map(q=>`<div class="quest-row"><div><h3>${esc(q.name)}</h3><p>${time(q.baseSeconds*1000)} · ${s.questWins[q.id]||0} successful returns</p></div>${btn('Read','quest',q.id,{class:'small'})}</div>`).join('')}</section>`).join('')}<section class="panel"><div class="section-head"><h3>Stories brought home</h3><span class="pill">${s.stats.questsWon} wins · ${s.stats.questsLost} retreats</span></div>${s.runs.slice(-8).reverse().map(r=>`<div class="quest-row"><div><h3>${esc(D.quests[r.questId]?.name)}</h3><p>${r.heroIds.map(id=>esc(s.adventurers.find(h=>h.id===id)?.name||'Adventurer')).join(' & ')} · ${title(r.status)}</p></div>${btn('Watch','battle',r.id,{class:'small'})}</div>`).join('')||'<p class="small muted">The first adventure will appear here soon.</p>'}</section></div></div>`;}

  function upgrades(){const s=game.state;let body='';if(UI.upgradesTab==='staff'){body=`<div class="grid-2">${values(D.staff).filter(m=>player().level>=(m.requires?.level||1)).map(m=>{const hired=s.staff[m.id];const price=game.staffPrice(m.id);return `<section class="panel upgrade-card">${icon('people','upgrade-symbol')}<div class="row spread"><h3>${esc(m.name)}</h3>${hired?`<span class="pill live">Level ${hired.level||1}</span>`:''}</div><p>${esc(m.description)}</p>${effectList(m.effects)}<span class="tiny muted">${hired?'Learns through '+esc(m.work)+' work. '+(hired.active?'Currently working.':'On leave.'):'One-time contract · no wages · Smith level '+(m.requires?.level||1)}</span>${hired?btn(hired.active?'Give time off':'Return to work','staff-toggle',m.id):btn('Hire · '+num(price)+' g','staff-hire',m.id,{class:'primary',disabled:player().gold<price||player().level<(m.requires?.level||1)})}</section>`;}).join('')}</div>`;}else if(UI.upgradesTab==='decor'){body=`<div class="grid-2">${values(D.decor).map(x=>`<section class="panel upgrade-card">${icon('leaf','upgrade-symbol')}<h3>${esc(x.name)}</h3><p>${esc(x.description)}</p>${effectList(x.effects)}<span class="tiny muted">Kept through Legacy retirement</span>${btn(s.decorations.includes(x.id)?'Installed':'Install · '+num(x.cost)+' g','decorate',x.id,{class:'primary',disabled:s.decorations.includes(x.id)||player().gold<x.cost})}</section>`).join('')}</div>`;}else body=`<div class="grid-3">${values(D.upgrades).filter(x=>!(/requirement/i.test(game.upgradePreview(x.id).reason))).map(x=>{const p=game.upgradePreview(x.id);return `<section class="panel upgrade-card">${icon(x.effects?.lanes?'anvil':x.effects?.enchanting?'foci':x.effects?.partySize?'people':'tools','upgrade-symbol')}<div class="row spread"><h3>${esc(x.name)}</h3><span class="pill">${p.level} / ${p.maxLevel||x.maxLevel}</span></div><div class="level-dots">${Array.from({length:x.maxLevel},(_,i)=>`<i class="${i<p.level?'on':''}"></i>`).join('')}</div><p>${esc(x.description)}</p>${effectList(x.effects)}${p.reason&&!p.eligible?`<span class="tiny muted">${esc(p.reason)}</span>`:''}${btn(p.level>=x.maxLevel?'Fully improved':'Improve · '+num(p.cost)+' g','upgrade',x.id,{class:p.eligible?'primary':'',disabled:!p.eligible})}</section>`;}).join('')}</div>`;
    return head('Grow your workshop','Better tools. Better possibilities.','Improve the equipment, hire capable hands, and make this place your own.')+`<div class="chip-tabs">${[['stations','Stations & shop'],['staff','Apprentices & staff'],['decor','Shop character']].map(([id,label])=>`<button type="button" data-action="upgrades-tab" data-id="${id}" class="${UI.upgradesTab===id?'active':''}">${label}</button>`).join('')}</div>`+body;
  }
  function legacy(){const s=game.state,p=s.player,d=game.derived(),unlocked=p.legacy.generation>1;const branches=['force','artifice','commerce','lore'];return head('The family legacy','Some things outlast the forge.','Retire when you choose. Leave an heirloom, and teach the next generation what you learned.')+`<section class="legacy-hero">${icon('tree')}<div class="eyebrow">Generation ${p.legacy.generation}</div><h2 style="margin-top:9px">${unlocked?num(p.legacy.points)+' unspent Sparks':'A legacy begins with your first retirement'}</h2><p>Reach smith level 8 and win six quests to retire. Your next smith inherits permanent talents, collection history, decorations, and one chosen item with its recipe. Ordinary shop and quarry progress begin anew.</p><div class="row" style="justify-content:center"><span class="pill ${p.level>=8?'live':''}">Smith level ${p.level} / 8</span><span class="pill ${s.stats.questsWon>=6?'live':''}">Victories ${s.stats.questsWon} / 6</span><span class="pill gold">Retirement award: ${d.legacyReward} Sparks</span></div><div style="margin-top:20px">${btn('Plan retirement','retirement','',{class:'primary',icon:'tree',disabled:!d.legacyEligible})}</div></section><div class="grid-2">${branches.map(tree=>`<section class="panel talent-tree"><div class="row spread"><h3>${title(tree)}</h3><span class="tiny muted">Permanent lessons</span></div>${values(D.talents).filter(t=>(t.tree||t.branch||'').toLowerCase()===tree).map((t,index)=>{const owned=p.talents.includes(t.id);const eligible=unlocked&&!owned&&p.legacy.points>=t.cost&&(t.requires||[]).every(id=>p.talents.includes(id));return `<article class="talent-node ${owned?'owned':''}"><span class="node-dot">${owned?'✓':index+1}</span><h4>${esc(t.name)}</h4><p>${esc(t.description)}</p>${btn(owned?'Learned':t.cost+' '+(t.cost===1?'Spark':'Sparks'),'talent',t.id,{class:eligible?'primary':'',disabled:!eligible})}</article>`;}).join('')}</section>`).join('')}</div>`;}
  function journal(){const s=game.state;const body=UI.journalTab==='log'?`<section class="panel"><div class="log-list">${s.logs.map(l=>`<div class="log-entry"><time>${Math.floor(l.time/60000)}:${String(Math.floor(l.time/1000)%60).padStart(2,'0')}</time><p>${esc(l.text)}</p></div>`).join('')||'<p class="small muted">Your story begins with the first item.</p>'}</div></section>`:UI.journalTab==='proficiency'?`<div class="grid-3">${values(D.classes).map(c=>{const p=player().proficiency[c.id]||{level:0,xp:0};return `<section class="panel"><div class="row spread">${icon(c.id)}<span class="gold">${p.level} / 100</span></div><h3 style="margin:14px 0">${esc(c.name)}</h3>${meter(p.xp/(6+2*p.level)*100,'blue')}<p class="tiny muted" style="margin:10px 0">${num(p.xp)} / ${6+2*p.level} XP to the next point</p><p class="small muted">+${(p.level*.65).toFixed(1)} quality · +${(p.level*.6).toFixed(1)}% crafting speed contribution</p>${btn('Practice this craft','class',c.id,{class:'small',extra:'style="margin-top:15px"'})}</section>`;}).join('')}</div>`:`<div class="collection-grid">${values(D.recipes).filter(r=>player().legacy.collection[r.id]!==undefined||knownRecipes().some(k=>k.id===r.id)).map(r=>{const q=player().legacy.collection[r.id];return `<article class="collection-item ${q!==undefined?'known':''}">${icon(r.classId)}<h3>${esc(r.name)}</h3><p>${q!==undefined?'Best craftsmanship: '+q+' / 100':'Not yet crafted'}</p>${q>=85?'<span class="pill gold" style="margin-top:10px">Masterwork recorded</span>':''}</article>`;}).join('')}</div>`;
    return head('The chronicle','Every piece leaves a mark.','Collection records remain with the family, even when a new generation takes over.')+`<div class="chip-tabs">${[['collection','Collection'],['proficiency','Craft proficiencies'],['log','Workshop journal']].map(([id,name])=>`<button type="button" data-action="journal-tab" data-id="${id}" class="${UI.journalTab===id?'active':''}">${name}</button>`).join('')}</div>`+body;
  }

ction></div>`;}

    if(name==='quest'){const q=D.quests[UI.selectedQuest];if(!q||!s.unlocks.quests.includes(q.id))return;modalShell(esc(q.name),`<p class="modal-intro">${esc(q.description)}</p><div class="row"><span class="pill">${time(q.baseSeconds*1000)}</span>${q.boss?'<span class="pill rare">A formidable foe</span>':''}</div><div class="hint-box">${q.enemies.map(e=>`${esc(e.name)} · ${num(e.health)} health · ${e.attack} attack · ${e.armor} armor`).join('<br>')}</div><p class="small muted">Adventurers choose this quest when their equipment and experience make it a suitable challenge. After a defeat they rest, shop for upgrades, and may try an easier journey.</p><div class="detail-line"><span>Gifts on return</span><span>${q.rewards.gold}g · ${esc(costText(q.rewards.materials))}</span></div><div class="modal-actions">${btn('Back to work','close','',{class:'primary'})}</div>`);return;}
    if(name==='battle'){const run=s.runs.find(r=>r.id===UI.selectedRun);if(!run){UI.modal=null;renderModal();return;}modalShell(esc(D.quests[run.questId]?.name||'Adventure'),`${scene('battle','data-run="'+run.id+'"')}<div data-battle-view="${run.id}" data-large-battle></div><div class="hint-box">The equipment you made is doing the work. Every hit shown belongs to the actual encounter, and your forge continues while you watch.</div><div class="modal-actions">${btn('Back to the village','close','',{class:'primary'})}</div>`,true);return;}
    if(name==='enchant'){const i=s.inventory.find(x=>x.id===UI.selectedItem);if(!i)return;modalShell('Inscribe an enchantment',`<p class="modal-intro">${esc(itemName(i))}. An enchantment adds a deliberate property. Knowledge and permanent talents strengthen its effect.</p><div class="stack">${values(D.enchantments).filter(e=>game.enchantPreview(i.id,e.id).gates?.every(g=>g.met)&&(!e.slots?.length||e.slots.includes(D.recipes[i.recipeId].slot))).map(e=>`<section class="panel quiet"><div class="row spread"><h3>${esc(e.name)}</h3><span class="gold">${num(e.cost)} g</span></div><p class="small muted" style="margin:10px 0">${esc(e.description)}</p><p class="tiny muted">${esc(costText(e.inputs))}</p><p class="tiny muted">${esc(game.enchantPreview(i.id,e.id).reason)}</p><p class="tiny muted">Smith level ${e.requires?.level||1} · ${Object.entries(e.requires?.upgrades||{}).map(([id,n])=>esc(D.upgrades[id]?.name)+' '+n).join(', ')}</p>${btn('Inscribe','enchant',e.id,{class:'small',extra:`style="margin-top:12px"`,disabled:!game.enchantPreview(i.id,e.id).eligible})}</section>`).join('')}</div>`);return;}
    if(name==='automation'){const a=s.automation;modalShell('A little help at the forge',`<p class="modal-intro">Customers already handle their own shopping and adventures. An assistant desk can also repeat a recipe and buy ordinary crafting supplies within your limits.</p><div class="stack"><label><input type="checkbox" data-auto="enabled" ${a.enabled?'checked':''}> Enable assistant production</label><label class="field">Repeat recipe<select data-auto="recipeId"><option value="">Choose a recipe</option>${knownRecipes().map(r=>`<option value="${r.id}" ${a.recipeId===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select></label><div class="form-grid"><label class="field">Target stock<input type="number" min="1" max="50" value="${a.targetStock}" data-auto="targetStock"></label><label class="field">Gold to keep<input type="number" min="0" value="${a.goldReserve}" data-auto="goldReserve"></label><label class="field">Offline supply budget<input type="number" min="0" value="${a.spendCap}" data-auto="spendCap"></label></div><label><input type="checkbox" data-auto="autoBuy" ${a.autoBuy?'checked':''}> Buy required common supplies</label></div><div class="hint-box">Displayed work is for sale to customers. Protect treasured pieces or move them to the stockroom to keep them.</div><div class="modal-actions">${btn('Save production plan','save-automation','',{class:'primary'})}</div>`);return;}

  function paintTimers(){if(!game)return;const s=game.state;document.querySelectorAll('[data-job-progress]').forEach(el=>{const j=s.jobs.find(x=>x.id===el.dataset.jobProgress);if(j)el.firstElementChild.style.width=pct(j.status==='active'?(s.simTime-j.startedAt)/(j.duration||j.completeAt-j.startedAt)*100:0)+'%';});document.querySelectorAll('[data-job-time]').forEach(el=>{const j=s.jobs.find(x=>x.id===el.dataset.jobTime);if(j)el.textContent=j.status==='active'?time(j.completeAt-s.simTime):'Reserved';});document.querySelectorAll('[data-rest]').forEach(el=>{const h=s.adventurers.find(x=>x.id===el.dataset.rest);if(h)el.textContent='Resting for '+time(h.recoverUntil-s.simTime)+'. Will return for better equipment.';});const qd=game.quarryDerived();document.querySelectorAll('[data-quarry-progress]').forEach(el=>el.firstElementChild.style.width=pct(qd.progress*100)+'%');document.querySelectorAll('[data-quarry-time]').forEach(el=>el.textContent=time(s.quarry.nextYieldAt-s.simTime));document.querySelectorAll('[data-mine-button]').forEach(el=>{el.disabled=!qd.manualReady||UI.readOnly;});}
  function paintBattle(){if(!game)return;document.querySelectorAll('[data-battle-view]').forEach(el=>{const view=game.battleView(el.dataset.battleView);if(!view)return;const run=game.state.runs.find(r=>r.id===view.id),large=el.hasAttribute('data-large-battle'),events=(view.events||[]).slice(large?-12:-2).reverse(),hp=h=>Math.max(0,Math.ceil(h.hp||0));const health=arr=>arr.map(h=>`<div class="battle-hp"><div><b>${esc(h.name)}</b><span>${hp(h)}/${Math.ceil(h.maxHp||h.maxHealth||1)}</span></div>${meter(hp(h)/(h.maxHp||h.maxHealth||1)*100,arr===view.heroes?'health':'enemy')}</div>`).join('');const text=`<div class="battle-status"><span class="status-dot ${view.victory===false?'defeat':''}"></span><b>${view.victory===true?'A happy return!':view.victory===false?'Home to recover':title(view.status)}</b><span>${run?.status==='complete'?'Story recorded':time(view.returnIn||0)}</span></div><div class="hp-pair">${health(view.heroes||[])}${health(view.enemies||[])}</div><div class="battle-log">${events.length?events.map(e=>`<p>${esc(e.text||e.message||'An exchange of blows.')}</p>`).join(''):'<p>A little courage, and a good blade.</p>'}</div>`;if(el._lastText!==text){el.innerHTML=text;el._lastText=text;}});}
  document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el||el.disabled||!game)return;event.preventDefault();const action=el.dataset.action,id=el.dataset.id;const s=game.state;
    switch(action){
      case'nav':UI.view=id;UI.modal=null;UI.selectedHero=id==='inventory'?UI.selectedHero:null;render();renderModal();window.scrollTo({top:0,behavior:'instant'});break;

      case'recipe':UI.recipe=id;render();break;

      case'preset':UI.setupStats=({balanced:{strength:4,precision:4,charisma:4,knowledge:4},forge:{strength:6,precision:4,charisma:2,knowledge:4},precision:{strength:3,precision:6,charisma:3,knowledge:4},merchant:{strength:3,precision:3,charisma:6,knowledge:4}})[id];renderModal();break;
      case'setup-plus':if(values(UI.setupStats).reduce((a,b)=>a+b,0)<16&&UI.setupStats[id]<6)UI.setupStats[id]++;renderModal();break;
      case'setup-minus':if(UI.setupStats[id]>2)UI.setupStats[id]--;renderModal();break;
      case'begin':{const r=act('create',{name:UI.setupName.trim()||'Ember & Iron',stats:UI.setupStats});if(r.ok){UI.modal=null;lastTick=Date.now();save(true);render();renderModal();}break;}
      case'craft':act('craft',{recipeId:id,quantity:UI.quantity});break;
      case'technique':act('technique',{jobId:id});break;
      case'cancel':act('cancel',{jobId:id});break;
      case'attributes':openModal('attributes');break;
      case'allocate':act('allocate',{stat:id});renderModal();break;
      case'respec-confirm':openModal('respec-confirm');break;
      case'respec':if(act('respec').ok)UI.modal='attributes';renderModal();break;
      case'quarry-tab':UI.quarryTab=id;render();break;
      case'quarry-upgrade':act('quarryUpgrade',{upgradeId:id});break;
      case'quarry-worker':act('hireQuarryWorker',{workerId:id});break;
      case'mine':act('mine',{materialId:id});break;
      case'market':openModal('market');break;
      case'material':act('buyMaterial',{materialId:id,quantity:Number(el.dataset.quantity)||1});if(UI.modal)renderModal();break;
      case'sell-material':act('sellMaterial',{materialId:id,quantity:Number(el.dataset.quantity)||1});if(UI.modal)renderModal();break;
      case'item':UI.itemHero=UI.selectedHero;openModal('item',id);break;
      case'protect':act('protect',{itemId:id});if(UI.modal)renderModal();break;
      case'display':act('display',{itemId:id});renderModal();break;
      case'fill-shelves':{if(UI.readOnly){toast('Take control of this workshop first.',true);break;}let filled=0;for(const i of [...s.inventory]){if(i.displayed||i.protected||i.reservedFor)continue;if(s.inventory.filter(x=>x.displayed).length>=game.derived().displayCapacity)break;if(game.act('display',{itemId:i.id}).ok)filled++;}save(true);render();toast(filled?'Set '+filled+' pieces out for your customers.':'There are no spare pieces to display.');break;}
      case'stock-room':if(s.inventory.some(i=>!i.displayed&&!i.protected&&!i.reservedFor))openModal('restock');else{UI.view='workshop';render();toast('Craft a new piece to fill that place.');}break;
      case'customer':UI.selectedHero=id;UI.itemHero=id;UI.view='inventory';UI.modal=null;render();renderModal();toast('Choose equipment for '+(s.adventurers.find(h=>h.id===id)?.name||'this customer')+'.');break;
      case'sell-equip':case'sell-send':if(act('sell',{itemId:id,heroId:UI.itemHero,dispatch:action==='sell-send'}).ok){UI.modal=null;renderModal();}break;
      case'gift':if(act('gift',{itemId:id,heroId:UI.itemHero}).ok){UI.modal=null;renderModal();}break;
      case'town':if(act('sell',{itemId:id,heroId:null,dispatch:false}).ok){UI.modal=null;renderModal();}break;
      case'salvage-confirm':UI.selectedItem=id;openModal('salvage-confirm');break;
      case'salvage':if(act('salvage',{itemId:id}).ok){UI.modal=null;renderModal();}break;
      case'enchant-menu':UI.selectedItem=id;openModal('enchant');break;
      case'enchant':if(act('enchant',{itemId:UI.selectedItem,enchantmentId:id}).ok)UI.modal='item';renderModal();break;
      case'hero':UI.heroQuest=s.adventurers.find(h=>h.id===id)?.questId;openModal('hero',id);break;
      case'hero-quest':{const h=s.adventurers.find(h=>h.id===id);UI.party=[id];openModal('quest',UI.heroQuest||h.questId);break;}
      case'quest':UI.party=[];openModal('quest',id);break;
      case'dispatch':if(act('dispatch',{questId:id,heroIds:UI.party}).ok){UI.modal=null;UI.selectedRun=s.runs[s.runs.length-1]?.id;UI.view='workshop';render();renderModal();}break;
      case'battle':openModal('battle',id);break;
      case'route':act('route',{questId:el.dataset.quest,choiceId:id});renderModal();break;
      case'upgrades-tab':UI.upgradesTab=id;render();break;
      case'upgrade':act('upgrade',{upgradeId:id});break;
      case'staff-hire':act('hireStaff',{staffId:id});break;
      case'staff-toggle':act('toggleStaff',{staffId:id});break;
      case'decorate':act('decorate',{decorId:id});break;
      case'talent':act('talent',{talentId:id});break;
      case'journal-tab':UI.journalTab=id;render();break;
      case'automation':openModal('automation');break;
      case'save-automation':{const payload={};document.querySelectorAll('[data-auto]').forEach(input=>payload[input.dataset.auto]=input.type==='checkbox'?input.checked:input.type==='number'?Number(input.value):input.value||null);if(act('automation',payload).ok){UI.modal=null;renderModal();}break;}
      case'retirement':openModal('retirement');break;
      case'confirm-retire':{const heirloomItemId=document.getElementById('heirloom-choice')?.value||null;if(act('retire',{heirloomItemId,confirmed:true}).ok){UI.modal=null;UI.selectedItem=null;UI.selectedHero=null;UI.selectedRun=null;UI.watchPinned=false;UI.party=[];UI.view='legacy';if(!game.state.started)UI.modal='create';render();renderModal();}break;}
      case'mailbox':openModal('mailbox');break;
      case'claim':act('claim',{bundleId:id});renderModal();break;
      case'reclaim':act('reclaim');break;
      case'commission-accept':act('acceptCommission',{commissionId:id});break;
      case'commission-deliver':act('fulfillCommission',{commissionId:id,itemId:el.dataset.item});break;
      case'takeover':{const raw=storageGet(SAVE);if(raw){const result=game.importSave(raw);if(!result.ok){toast('The latest save could not be loaded. Export or reload before taking control.',true);break;}}claimLease(true);game.advanceOffline(Date.now());lastTick=Date.now();UI.modal=game.state.started?null:'create';save(true);render();renderModal();toast('This tab now controls the latest saved workshop.');break;}
      case'export':{save(true);const blob=new Blob([game.exportSave()],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ember-and-iron-generation-'+player().legacy.generation+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Save exported.');break;}
      case'import':document.getElementById('import-file').click();break;
      case'backup':{const raw=storageGet(BACKUP);const result=raw&&EIEngine.validateSave(raw,D);if(!result?.ok)toast('No valid backup is available.',true);else{UI.importText=raw;openModal('confirm-import');}break;}
      case'confirm-import':{if(UI.readOnly){toast('Take control of this tab first.',true);break;}const result=game.importSave(UI.importText);toast(result.message,!result.ok);if(result.ok){UI.modal=null;UI.view='workshop';UI.party=[];UI.selectedRun=null;UI.watchPinned=false;lastTick=Date.now();game.advanceOffline(Date.now());save(true);render();renderModal();}break;}
    }
  });
  document.addEventListener('input',event=>{const el=event.target;if(el.dataset.input==='shopName')UI.setupName=el.value;if(el.dataset.input==='recipeSearch'){UI.search=el.value;render();}});
  document.addEventListener('change',event=>{const el=event.target,key=el.dataset.input;if(el.dataset.party){if(el.checked)UI.party.push(el.dataset.party);else UI.party=UI.party.filter(id=>id!==el.dataset.party);renderModal();return;}if(!key||!game)return;switch(key){case'classFilter':UI.classFilter=el.value;render();break;case'quantity':UI.quantity=Number(el.value);render();break;case'inventoryFilter':UI.inventoryFilter=el.value;render();break;case'watchedRun':UI.watchPinned=el.value!=='auto';UI.selectedRun=UI.watchPinned?el.value:null;render();break;case'deposit':act('quarryDeposit',{materialId:el.value});break;case'itemHero':UI.itemHero=el.value;renderModal();break;case'heroQuest':UI.heroQuest=el.value;break;case'reduced':case'large':UI[key]=el.checked;document.body.classList.toggle(key==='reduced'?'reduce-motion':'large-text',el.checked);storageSet(SAVE+'-preferences',JSON.stringify({reduced:UI.reduced,large:UI.large}));break;}});
  document.getElementById('import-file').addEventListener('change',async event=>{const file=event.target.files?.[0];if(!file)return;if(file.size>12000000){toast('That save file is too large.',true);return;}const text=await file.text();const result=EIEngine.validateSave(text,D);if(!result.ok){toast(result.message,true);return;}UI.importText=text;openModal('confirm-import');event.target.value='';});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.modal&&UI.modal!=='create'){UI.modal=null;renderModal();}if(e.key==='Tab'&&UI.modal){const modal=document.querySelector('.modal'),nodes=modal?.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),a[href]');if(!nodes?.length)return;const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
  window.addEventListener('storage',e=>{if(e.key===LEASE){let lease;try{lease=JSON.parse(e.newValue||'null');}catch(_){}if(lease&&lease.owner!==owner){UI.readOnly=true;leaseOwned=false;UI.force=true;}}});
  window.addEventListener('pagehide',()=>{save(true);if(leaseOwned){try{const lease=JSON.parse(localStorage.getItem(LEASE)||'null');if(lease?.owner===owner)localStorage.removeItem(LEASE);}catch(_){}}});
  document.addEventListener('visibilitychange',()=>save(true));
  init();
  requestAnimationFrame(animateScenes);
})();



</script>
</body>
</html>
