    <main class="page" id="main">${UI.readOnly?`<div class="notice warn">This workshop is running in another tab. ${btn('Take control','takeover','',{class:'small'})}</div>`:''}${saveError?`<div class="notice warn">${esc(saveError)}${btn('Export save','export','',{class:'small'})}</div>`:''}
    ${mainRoom?objectiveBanner():`<div class="return-row">${btn('Back to the forge','nav','workshop',{class:'subtle',icon:'arrow'})}</div>`}
    <nav class="flow-nav" aria-label="Workshop locations">${[['quarry','mine','Mine','Gather materials'],['workshop','anvil','Forge','Make equipment'],['inventory','box','Shop','Stock your shelves']].map(([id,i,name,sub],n)=>`<button class="flow-tab ${UI.view===id?'active':''}" data-action="nav" data-id="${id}" aria-current="${UI.view===id?'page':'false'}"><span class="step-number">${n+1}</span>${art(i,30)}<span><b>${name}</b><small>${sub}</small></span></button>`).join('')}<div class="flow-return">${icon('coins')} Sell & grow ${icon('arrow')}</div></nav>
    ${renderView()}<footer class="footer-note"><span><i class="save-dot"></i>${UI.readOnly?'Read only':saveError?'Export to keep progress':'Saved automatically'} · Generation ${p.legacy.generation}</span><a href="design/game-specification.html" target="_blank" rel="noopener">Game guide ↗</a></footer></main></div>`;
    if(focus){const el=document.querySelector('[data-focus="'+focus+'"]');if(el){el.focus({preventScroll:true});try{el.setSelectionRange(selection.start,selection.end);}catch(_){}}}
    paintTimers();paintBattle();mountScenes();
  }

  function art(id,size=32){return window.EIScenes?.icon(id,size)||icon(id);}
  function portrait(id){return window.EIScenes?.portrait(id)||art('people',40);}
  function knownRecipes(){return values(D.recipes).filter(r=>game.craftPreview(r.id).gates.filter(g=>g.source!=='Quarry or material shop').every(g=>g.met));}
  function activeRun(){const s=game.state,selected=s.runs.find(r=>r.id===UI.selectedRun);return selected&&(UI.watchPinned||!['complete','pending'].includes(selected.status))?selected:s.runs.find(r=>!['complete','pending'].includes(r.status))||selected||s.runs[s.runs.length-1];}
  function scene(kind,extra=''){const labels={forge:'The blacksmith working at a glowing forge',shop:'Customers walking into your shop and browsing the shelves',quarry:'Miners gathering materials in the quarry',battle:'Adventurers in their current encounter',village:'Your growing blacksmith village'};return `<canvas class="pixel-scene ${kind}-scene" data-scene="${kind}" width="1280" height="480" role="img" aria-label="${labels[kind]||labels.village}" ${extra}></canvas>`;}

  function villageDashboard(room){
    const s=game.state,meta={forge:['Your forge','Good equipment starts here.'],quarry:['The quarry','Gather the materials for your next craft.'],shop:['Your shop','Customers buy useful gear and head out on their own.']}[room];
    const active=s.jobs.filter(j=>j.status==='active').length,visitors=s.adventurers.filter(h=>['browsing','ready'].includes(h.status)).length;
    const status=room==='forge'?(active?active+' craft'+(active===1?'':'s')+' in progress':'Ready to craft'):room==='shop'?(visitors?visitors+' customers visiting':'Waiting for customers'):'Materials arrive automatically';
    return `<div class="workspace-layout ${UI.watchOpen?'':'theatre-closed'}"><section class="room-panel"><div class="room-heading"><div><h1>${meta[0]}</h1><p>${meta[1]}</p></div><span class="room-status"><i></i>${status}</span></div><div class="room-scene">${scene(room)}</div>${room==='forge'?forgeWorkbench():room==='quarry'?quarryWorkbench():shopShelves()}</section><aside class="world-panel">${UI.watchOpen?battleCard():`<button class="open-theatre" data-action="toggle-watch">${icon('map')}<span>Adventure window<small>See how your equipment helps</small></span>${icon('plus')}</button>`}</aside></div>`;
  }

  function villageNotes(){const logs=game.state.logs.filter(l=>['sale','quest','customer','commission','relationship'].includes(l.type)).slice(0,3);return `<section class="panel little-notes"><div class="section-head"><h3>Word around town</h3>${icon('book')}</div>${logs.length?logs.map(l=>`<p><i></i>${esc(l.text)}</p>`).join(''):'<p><i></i>Your sign is up. The first visitors are on their way.</p>'}</section>`;}
  const sceneInstances=new Map();
  let sceneFrame=0;
  function mountScenes(){
    for(const [canvas,instance] of sceneInstances)if(!canvas.isConnected){instance.destroy();sceneInstances.delete(canvas);}
    if(!window.EIScenes)return;
    document.querySelectorAll('[data-scene]').forEach(canvas=>{if(!sceneInstances.has(canvas))sceneInstances.set(canvas,EIScenes.mount(canvas,{kind:canvas.dataset.scene,onAction:action=>{if(action.type==='room'){UI.view=({forge:'workshop',shop:'inventory',quarry:'quarry'})[action.room]||'workshop';render();}else if(action.type==='battle'&&activeRun())openModal('battle',activeRun().id);}}));});
  }
  function animateScenes(now){
    if(game&&!document.hidden&&now-sceneFrame>45){sceneFrame=now;const s=game.state;for(const [canvas,instance] of sceneInstances){const run=canvas.dataset.run?s.runs.find(r=>r.id===canvas.dataset.run):activeRun();instance.draw({state:s,data:D,derived:game.derived(),battle:run?game.battleView(run.id):null,selectedRoom:UI.view==='quarry'?'quarry':UI.view==='inventory'?'shop':'forge'},s.simTime+(UI.readOnly?0:Math.min(250,Math.max(0,Date.now()-lastTick))),UI.reduced||matchMedia('(prefers-reduced-motion: reduce)').matches);}}
    requestAnimationFrame(animateScenes);
  }

  function head(eyebrow,name,description,actions=''){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${name}</h1><p>${description}</p></div>${actions}</div>`;}
  function resources(){const s=game.state;return `<div class="resource-strip"><span class="stockroom-label">IN YOUR SATCHEL</span>${['bronze','iron','steel','mithril','starforged','wood','leather','fuel','gem'].filter(id=>s.materials[id]>0||['bronze','wood','leather','fuel'].includes(id)).map(id=>`<span class="resource-chip">${art(id,22)}<span>${esc(materialName(id))}</span><b>${num(s.materials[id])}</b></span>`).join('')}${btn('+ Supplies','market','',{class:'small supply-link'})}</div>`;}

  function renderView(){switch(UI.view){case'workshop':return workshop();case'quarry':return quarry();case'inventory':return inventory();case'adventurers':return adventurers();case'expeditions':return expeditions();case'upgrades':return upgrades();case'legacy':return legacy();case'journal':return journal();case'settings':return settings();default:return workshop();}}
  function tutorial(){const s=game.state;if(!s.stats.crafted)return `<div class="tutorial-note">${art('star',24)}<span><b>Every great shop starts with one good blade.</b> Craft your first piece below. It goes onto an empty shelf, and customers handle the rest.</span></div>`;if(!s.stats.sold)return `<div class="tutorial-note">${art('box',24)}<span><b>Set it out and let it shine.</b> Customers browse displayed pieces, buy useful upgrades and head out on their own adventures.</span></div>`;return '';}

  function workshop(){return villageDashboard('forge');}
  function forgeWorkbench(){
    const s=game.state,known=knownRecipes(),r=known.find(x=>x.id===UI.recipe)||known[0];if(!r)return '<div class="room-controls">Learn a new craft to begin.</div>';UI.recipe=r.id;
    const preview=game.craftPreview(r.id,{quantity:UI.quantity}),prof=s.player.proficiency[r.classId],enough=preview.eligible;
    return `<div class="room-controls"><div class="selected-craft"><div class="craft-identity"><div class="item-sprite">${art(r.classId,68)}</div><div><span class="eyebrow">SELECTED RECIPE</span><h2>${esc(r.name)}</h2><span class="quality-label">${grade(preview.quality)} <b>${preview.quality}</b><small>/100 quality</small></span></div></div>${btn('Change recipe','recipes','',{class:'recipe-change',icon:'book'})}</div>
    <div class="craft-requirements"><div class="ingredients-label">Materials needed${btn('Supplies','market','',{class:'subtle small'})}</div><div class="ingredient-list">${Object.entries(preview.inputs).map(([id,n])=>`<div class="ingredient ${s.materials[id]<n?'missing':''}">${art(id,30)}<span><b>${esc(materialName(id))}</b><small>${Math.min(s.materials[id]||0,n)} / ${n} ready${s.materials[id]<n?' · need '+(n-(s.materials[id]||0)):''}</small></span>${s.materials[id]>=n?icon('check'):icon('minus')}</div>`).join('')}</div></div>
    <div class="craft-action-row"><div class="craft-estimate"><span>${icon('clock')} ${time(preview.seconds*1000)} per piece</span><span>${art('coins',20)} ${num(preview.price)}g shelf price</span></div><div class="craft-buttons"><select aria-label="Craft quantity" data-input="quantity" data-focus="quantity">${[1,2,3].map(n=>`<option value="${n}" ${UI.quantity===n?'selected':''}>${n} ${n===1?'piece':'pieces'}</option>`).join('')}</select>${btn(UI.quantity===1?'Start crafting':'Craft '+UI.quantity+' pieces','craft',r.id,{class:'primary',icon:'anvil',disabled:!enough})}</div></div>
    ${!enough?`<div class="craft-blocker">${icon('info')}<span>${esc(preview.reason)}</span>${preview.gates.some(g=>!g.met&&g.source==='Quarry or material shop')?btn(Object.entries(preview.inputs).some(([id,n])=>['bronze','fuel'].includes(id)&&s.materials[id]<n)?'Go to mine':'Get supplies',Object.entries(preview.inputs).some(([id,n])=>['bronze','fuel'].includes(id)&&s.materials[id]<n)?'nav':'market','quarry',{class:'small'}):''}</div>`:''}
    ${queue()}<div class="craft-footer"><span>${icon('star')} ${className(r.classId)} practice <b>Lv. ${prof.level}</b></span><span>+${r.smithXp||12*r.tier} smith XP per piece</span>${btn('Crafting details','craft-details',r.id,{class:'subtle small'})}</div></div>`;
  }

  function queue(){const s=game.state,d=game.derived();return `<section class="queue-card"><div class="section-head"><h3>${icon('flame')} ${s.jobs.length?'Work in progress':'Your anvil is ready'}</h3><span>${s.jobs.length} / ${d.queueCapacity+d.stationCount} queued</span></div>${s.jobs.length?`<div class="queue-list">${s.jobs.map(j=>`<div class="queue-item"><span class="queue-art">${art(D.recipes[j.recipeId].classId,32)}</span><div class="queue-detail"><div class="row spread"><b>${esc(D.recipes[j.recipeId].name)}</b><span data-job-time="${j.id}">${j.status==='active'?time(j.completeAt-s.simTime):'Waiting'}</span></div>${meter(j.status==='active'?(s.simTime-j.startedAt)/j.duration*100:0,'',`data-job-progress="${j.id}"`)}</div>${j.status==='active'?btn(j.technique?'Tempered ✓':'Temper +5','technique',j.id,{class:'small temper',disabled:j.technique}):''}${btn('×','cancel',j.id,{class:'subtle small',extra:'aria-label="Cancel '+esc(D.recipes[j.recipeId].name)+'"'})}</div>`).join('')}</div>`:'<p>Finished pieces go straight onto any empty shelf.</p>'}</section>`;}
  function objectiveBanner(){const goal=window.EIFlow?.next(game,D,{recipeId:UI.recipe})||{title:'Make something worth adventuring for',detail:'Gather materials, choose a recipe and fill your shop.',label:'Choose a recipe',action:'recipes',id:''},milestone=window.EIFlow?.milestone(game,D,{recipeId:UI.recipe});let action=goal.action||'nav',id=goal.id||'',label=goal.label||'Continue',disabled=false,extra='';if(action==='recipe'&&id===UI.recipe&&UI.view==='workshop'&&game.craftPreview(id).eligible&&!game.state.jobs.length){action='guided-craft';label='Craft '+D.recipes[id].name;}else if(action==='nav'&&id==='quarry'&&UI.view==='quarry'){const p=game.craftPreview(UI.recipe),missing=['fuel','bronze'].find(m=>(game.state.materials[m]||0)<(p.inputs[m]||0));if(missing){action='mine';id=missing;label=missing==='fuel'?'Gather fuel':'Mine bronze';disabled=!game.quarryDerived().manualReady;extra='data-mine-button';}}return `<section class="objective-banner" aria-label="Your next objective"><div class="objective-marker">${icon('star')}</div><div class="objective-copy"><span class="eyebrow">YOUR NEXT STEP</span><h2>${esc(goal.title)}</h2><p data-objective-detail>${esc(goal.detail)}</p>${milestone?.text?`<div class="milestone"><span>${esc(milestone.text)}</span>${Number.isFinite(milestone.progress)?meter(milestone.progress,'blue'):''}</div>`:''}</div>${btn(esc(label),action,id,{class:'objective-action',icon:'arrow',disabled,extra})}</section>`;}

  function recipePicker(){const known=knownRecipes(),classes=values(D.classes).filter(c=>known.some(r=>r.classId===c.id)),list=known.filter(r=>(UI.classFilter==='all'||r.classId===UI.classFilter)&&(!UI.search||r.name.toLowerCase().includes(UI.search.toLowerCase())));return `<p class="modal-intro">Practice a familiar craft for better quality, or make something a new customer will need.</p><div class="catalogue-controls"><select aria-label="Recipe class" data-input="classFilter" data-focus="classFilter"><option value="all">All available crafts</option>${classes.map(c=>`<option value="${c.id}" ${UI.classFilter===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><input type="search" aria-label="Find a recipe" placeholder="Find a recipe" value="${esc(UI.search)}" data-input="recipeSearch" data-focus="recipeSearch"></div><div class="recipe-picker">${list.map(r=>{const p=game.craftPreview(r.id);return `<button class="recipe-choice ${UI.recipe===r.id?'selected':''}" data-action="recipe" data-id="${r.id}">${art(r.classId,45)}<span><b>${esc(r.name)}</b><small>Quality ${p.quality} · ${time(p.seconds*1000)}</small><small>${p.eligible?'Materials ready':'Needs materials'} · practice ${player().proficiency[r.classId].level}</small></span>${UI.recipe===r.id?icon('check'):icon('arrow')}</button>`;}).join('')||'<p class="empty-state">No available recipes match your search.</p>'}</div><p class="catalogue-foot">More recipes appear as you improve your skills and equipment.</p>`;}
  function recentOutcome(){const log=game.state.logs.find(l=>['sale','commission','level'].includes(l.type));return log?`<div class="latest-outcome"><span>${icon(log.type==='sale'?'coins':'star')}</span><div><small>LATEST RESULT</small><p>${esc(log.text)}</p></div></div>`:'';}

  function customer(){const s=game.state,heroes=s.adventurers.filter(h=>['browsing','ready','recovering'].includes(h.status)).slice(0,3);return `<section class="panel customer-card"><div class="section-head"><h3>At your counter</h3><span class="pill">${heroes.filter(h=>h.status!=='recovering').length} browsing</span></div>${heroes.length?heroes.map(h=>`<button class="customer-row" data-action="hero" data-id="${h.id}"><span class="portrait">${portrait(h.archetypeId)}</span><span class="customer-info"><b>${esc(h.name)} <small>${esc(D.archetypes[h.archetypeId]?.name)}</small></b><span>${h.status==='recovering'?'Resting after a rough adventure':esc(h.shoppingReason||'Looking for a useful upgrade')}</span><small>${h.status==='recovering'?'Will be back when recovered':(D.archetypes[h.archetypeId]?.preferences||[]).slice(0,2).map(className).join(' & ')}</small></span><span class="customer-budget">${h.budget}g</span></button>`).join(''):`<div class="empty-state">${art('people',36)}<p>They’ll be back with stories.<br>Make a little stock while you wait.</p></div>`}<div class="counter-foot">Customers shop, form parties and adventure on their own.</div></section>`;}

  function battleCard(){const s=game.state,run=activeRun();if(run)UI.selectedRun=run.id;const heroes=run?(run.heroIds||[]).map(id=>s.adventurers.find(h=>h.id===id)?.name||'Adventurer').join(' & '):'',q=run?D.quests[run.questId]:null;return `<section class="adventure-window"><div class="theatre-heading"><div><span class="eyebrow">OUT IN THE WORLD</span><h2>Adventures</h2></div>${btn('−','toggle-watch','',{class:'icon-button',extra:'aria-label="Collapse adventure window"'})}</div>${scene('battle',run?'data-run="'+run.id+'"':'')}<div class="theatre-content">${run?`<span class="pill ${run.status!=='complete'?'live':''}">${run.status==='complete'?'RECORDED STORY':run.status==='pending'?'DELIVERY WAITING':'HAPPENING NOW'}</span><h3>${esc(heroes)}</h3><p class="adventure-destination">${esc(q?.name)}</p><div data-battle-view="${run.id}"></div>${run.status==='pending'?btn('Make room for gifts','market','',{class:'full',icon:'box'}):btn('Watch closely','battle',run.id,{class:'full',icon:'map'})}<details class="watch-choices" ${UI.watchChoices?'open':''} data-persist-details="watchChoices"><summary>Choose an adventure</summary><select aria-label="Watched adventure" data-input="watchedRun"><option value="auto" ${!UI.watchPinned?'selected':''}>Follow current adventures</option>${s.runs.slice(-12).reverse().map(r=>`<option value="${r.id}" ${UI.watchPinned&&r.id===run.id?'selected':''}>${esc((r.heroIds||[]).map(id=>s.adventurers.find(h=>h.id===id)?.name||id).join(' & '))} · ${esc(D.quests[r.questId]?.name)} · ${title(r.status)}</option>`).join('')}</select></details>`:`<h3>Their story starts with you.</h3><p>Put useful equipment on a shelf. Adventurers will buy it and set out on their own.</p>`}</div><div class="watch-foot">${icon('anvil')} Your forge keeps working.</div></section>${recentOutcome()}`;}

  function quarry(){return villageDashboard('quarry');}
  function quarryWorkbench(){const s=game.state,qd=game.quarryDerived(),worker=game.quarryPreview('miner','worker');return `<div class="room-controls"><div class="mine-toolbar"><label class="field">Working deposit<select aria-label="Active quarry deposit" data-input="deposit">${qd.availableDeposits.map(x=>`<option value="${x.materialId}" ${x.materialId===s.quarry.activeDeposit?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><div class="mine-stock">${art(s.quarry.activeDeposit,34)}<span><b>${s.materials[s.quarry.activeDeposit]||0}</b> ${esc(materialName(s.quarry.activeDeposit))} stored</span></div>${btn('All materials','market','',{class:'subtle small'})}</div><div class="gather-actions"><button class="gather-button bronze" data-action="mine" data-id="bronze" data-mine-button ${qd.manualReady?'':'disabled'}>${art('mine',40)}<span><b>Mine bronze</b><small>+1 bronze · free</small></span>${icon('plus')}</button><button class="gather-button fuel" data-action="mine" data-id="fuel" data-mine-button ${qd.manualReady?'':'disabled'}>${art('fuel',38)}<span><b>Gather fuel</b><small>+1 fuel · ${s.materials.fuel||0} stored</small></span>${icon('plus')}</button></div><div class="mining-cooldown" data-mining-status>${qd.manualReady?'You can gather every 5 seconds.':'Next gathering in '+time(s.quarry.nextManualAt-s.simTime)}</div>
    <div class="auto-haul"><div class="row spread"><span>${icon('clock')} Automatic haul: <b>${qd.yield} ${esc(materialName(s.quarry.activeDeposit))}</b></span><b data-quarry-time>${time(s.quarry.nextYieldAt-s.simTime)}</b></div>${meter(qd.progress*100,'blue','data-quarry-progress')}<p>${esc(qd.pausedReason||'The quarry keeps working while you forge or watch an adventure.')}</p></div><div class="helping-hand"><div>${art('people',42)}<span><b>${s.quarry.workers.miner||0} ${(s.quarry.workers.miner||0)===1?'miner':'miners'} helping</b><small>A miner adds +1 material to every haul. No wages.</small></span></div>${btn(worker.level>=worker.maxLevel?'Fully staffed':'Hire miner · '+worker.cost+'g','quarry-worker','miner',{class:'primary',disabled:!worker.eligible})}</div><div class="room-bottom-actions">${btn('Improve the quarry','quarry-manage','',{icon:'tools'})}${btn('Back to crafting','nav','workshop',{class:'subtle',icon:'arrow'})}</div></div>`;}
  function quarryManagement(){const s=game.state,workers=UI.quarryTab==='workers',list=values(workers?D.quarry.workers:D.quarry.upgrades);return `<p class="modal-intro">Improve each haul or hire specialists. Your quarry works automatically.</p><div class="chip-tabs">${[['upgrades','Equipment'],['workers','Workers']].map(([id,name])=>`<button data-action="quarry-tab" data-id="${id}" class="${UI.quarryTab===id?'active':''}">${name}</button>`).join('')}</div><div class="stack">${list.filter(x=>!(/requirement/i.test(game.quarryPreview(x.id,workers?'worker':'upgrade').reason))).map(x=>{const p=game.quarryPreview(x.id,workers?'worker':'upgrade');return `<section class="panel mini-upgrade"><div><h3>${esc(x.name)} <small>${p.level} / ${p.maxLevel}</small></h3><p>${esc(x.description)}</p></div>${btn((workers?'Hire':'Improve')+' · '+p.cost+'g',workers?'quarry-worker':'quarry-upgrade',x.id,{class:'primary small',disabled:!p.eligible})}</section>`;}).join('')}</div>`;}

  function inventory(){return villageDashboard('shop');}
  function shelfTile(item){const r=D.recipes[item.recipeId];return `<button class="shelf-tile ${item.protected?'keepsake':''}" data-action="item" data-id="${item.id}">${art(r.classId,42)}<span><b>${esc(r.name)}</b><small>${grade(item.quality)} · Quality ${item.quality}</small></span><strong>${item.protected?'♥':num(game.itemPrice(item.id))+'g'}</strong></button>`;}

  function shopShelves(){const s=game.state,d=game.derived(),stock=s.inventory.filter(i=>i.displayed),stored=s.inventory.filter(i=>!i.displayed),empty=Math.max(0,d.displayCapacity-stock.length),visitors=s.adventurers.filter(h=>['browsing','ready'].includes(h.status));return `<div class="room-controls"><div class="section-head shop-heading"><div><h2>For sale <span>${stock.length} / ${d.displayCapacity}</span></h2><p>${s.stats.sold} ${s.stats.sold===1?'piece':'pieces'} sold · Customers choose and pay automatically.</p></div>${btn('Fill empty shelves','fill-shelves','',{class:'primary',disabled:!empty||!stored.some(i=>!i.protected&&!i.reservedFor)})}</div><div class="shelf-grid">${stock.map(shelfTile).join('')}${empty?`<button class="shelf-tile empty ${stock.length?'':'only-empty'}" data-action="stock-room" aria-label="Fill an empty shelf">${icon('plus')}<span><b>${stock.length?empty+' free display spaces':'Your shelves are waiting'}</b><small>${stock.length?'Craft or restock a piece':'Craft something useful. Customers handle the rest.'}</small></span></button>`:''}</div>${visitors.length?`<div class="shop-demand"><span>${portrait(visitors[0].archetypeId)}</span><div><b>${esc(visitors[0].name)} is browsing</b><p>${(D.archetypes[visitors[0].archetypeId]?.preferences||[]).slice(0,2).map(className).join(' or ')} · ${visitors[0].budget}g to spend</p></div>${btn('Customers','nav','adventurers',{class:'small subtle'})}</div>`:'<p class="shop-demand quiet">Customers will arrive on their own. Keep a useful mix on display.</p>'}<div class="room-bottom-actions">${btn('Stockroom · '+stored.length,'stockroom-menu','',{icon:'box'})}${(s.commissions||[]).some(c=>c.status!=='complete')?btn('Customer requests','requests','',{icon:'book'}):''}${s.mailbox.length?btn('Deliveries · '+s.mailbox.length,'mailbox',''):''}${btn('Make more gear','nav','workshop',{class:'subtle',icon:'arrow'})}</div></div>`;}
  function stockroom(){const s=game.state,d=game.derived(),stored=s.inventory.filter(i=>!i.displayed),empty=s.inventory.filter(i=>i.displayed).length<d.displayCapacity;return `<p class="modal-intro">Stored items stay with you until you put them on display. Protected keepsakes are never sold automatically.</p><div class="stored-items">${stored.map(i=>`<div class="stored-item">${art(D.recipes[i.recipeId].classId,36)}<div><b>${esc(itemName(i))}</b><small>Quality ${i.quality}${i.protected?' · Protected keepsake':''}</small></div>${btn(i.protected?'Inspect':'Put on shelf',i.protected?'item':'display',i.id,{class:'small',disabled:!i.protected&&!empty})}</div>`).join('')||'<div class="empty-state">Your stockroom is empty. Completed crafts fill spare shelves automatically.</div>'}</div>`;}

  function marketItems(ids){return `<div class="market-grid">${ids.filter(id=>D.materials[id]&&(game.materialAvailable(id)||game.state.materials[id]>0)).map(id=>{const m=D.materials[id],cost=game.materialPrice(id),available=game.materialAvailable(id),held=game.state.materials[id]||0,qty=Math.min(5,held);return `<div class="market-item"><div class="row spread"><h3>${esc(m.name)}</h3><span class="tiny muted">${num(held)} held</span></div><span class="tiny muted">${Number.isFinite(cost)?available?num(cost)+' gold per unit':'Supplier locked · advance your smith or quests':'Found through exploration'}</span><div class="row">${btn('Buy 1','material',id,{class:'small',disabled:!available||player().gold<cost,extra:'data-quantity="1"'})}${btn('Buy 5','material',id,{class:'small',disabled:!available||player().gold<cost*5,extra:'data-quantity="5"'})}${Number.isFinite(m.price)&&qty?btn('Sell '+qty+' · '+Math.max(1,Math.floor(m.price*qty*.5))+' g','sell-material',id,{class:'small subtle',extra:'data-quantity="'+qty+'"'}):''}</div></div>`;}).join('')}</div>`;}
  function itemName(i){const r=D.recipes[i.recipeId];return `${i.affixId?D.affixes[i.affixId]?.name+' ':''}${r?.name||'Unknown item'}${i.enchantmentId?' · '+(D.enchantments[i.enchantmentId]?.name||'Enchanted'):''}`;}
  function combatDetails(stats,twoHanded){const labels={attack:'Attack',health:'Health',armor:'Armor',interval:'Attack interval',crit:'Critical chance',evasion:'Evasion',block:'Block chance',armorPen:'Armor penetration',lifesteal:'Lifesteal'};return `<div class="gear-tags">${Object.entries(stats).filter(([k,v])=>labels[k]&&Number.isFinite(v)&&v!==0).map(([k,v])=>`<span>${labels[k]}: ${['crit','evasion','block','lifesteal'].includes(k)?Math.round(v*100)+'%':Number(v).toFixed(1)+(k==='interval'?'s':'')}</span>`).join('')}${stats.damageType?`<span>${esc(title(stats.damageType))} damage</span>`:''}${twoHanded?'<span>Two-handed · blocks offhand</span>':''}${Object.entries(stats.resistances||{}).filter(([,v])=>v>0).map(([k,v])=>`<span>${esc(title(k))} resistance: ${Math.round(v*100)}%</span>`).join('')}</div>`;}
  function commissions(){const s=game.state,orders=s.commissions||[];return `<section class="panel commission-ledger"><div class="section-head"><div><span class="eyebrow">MADE FOR SOMEONE SPECIAL</span><h3>Little requests</h3></div>${art('book',27)}</div>${orders.filter(c=>c.status!=='complete').length?orders.filter(c=>c.status!=='complete').slice(-5).map(c=>{const h=s.adventurers.find(x=>x.id===c.heroId);return `<div class="commission-note"><b>${esc(h?.name)} · ${esc(c.name)}</b><p>${className(c.classId)} · Tier ${c.minTier}+ · Quality ${c.minQuality}+</p><small>${Math.round((c.premium-1)*100)}% extra + ${c.bonusGold}g · Put a matching piece on a shelf.</small></div>`;}).join(''):'<p class="small muted">As customers learn to trust your work, they’ll leave requests for a piece of their own. They collect matching displayed work automatically.</p>'}${orders.some(c=>c.status==='complete')?`<p class="tiny good" style="margin-top:12px">${orders.filter(c=>c.status==='complete').length} special requests fulfilled ♥</p>`:''}</section>`;}

  function effectList(effects){const labels={quality:'quality',heavyQuality:'heavy quality',speed:'craft speed',capacity:'item capacity',materialCapacity:'material capacity',queue:'queue slots',lanes:'production lanes',display:'display slots',partySize:'party members',expeditions:'expedition slots',arrival:'arrival rate',sale:'sale value',budget:'customer budget',staffDiscount:'staff discount',materialDiscount:'supply discount',proficiencyXp:'proficiency XP',heroXp:'adventurer XP',loot:'quest loot',proficiencyGateReduction:'proficiency gate reduction',affixChance:'affix chance',enchant:'enchantment strength',attack:'item attack',heirloomCombat:'heirloom power',partySynergy:'party synergy',startStrength:'starting Strength',startGold:'starting gold',startProficiency:'starting proficiency',yield:'extraction yield',automation:'automation access',enchanting:'enchanting access'};return `<div class="effect-list">${Object.entries(effects||{}).filter(([k,v])=>typeof v==='number'&&v!==0).map(([k,v])=>`<span>+${Math.abs(v)<1?Math.round(v*100)+'%':v} ${esc(labels[k]||title(k))}</span>`).join('')}</div>`;}
  function adventurers(){const s=game.state;return head('THE REGULARS','Familiar faces. Faraway places.','They shop, choose their quests and find their way home. Your craft makes their stories possible.')+`<div class="customer-page"><div class="grid-2">${s.adventurers.map(h=>{const hs=game.heroStats(h.id)||{},a=D.archetypes[h.archetypeId];return `<article class="panel hero-card"><div class="person"><span class="portrait large">${portrait(h.archetypeId)}</span><div><h3>${esc(h.name)}</h3><small>${esc(a.name)} · Level ${h.level}</small></div><span class="pill ${['ready','browsing'].includes(h.status)?'live':''}">${esc(title(h.status))}</span></div><p class="small muted">${esc(h.shoppingReason||'Always happy to find something made with care.')}</p><div class="item-values"><div><span>Health</span><b>${num(hs.health)}</b></div><div><span>Attack</span><b>${Number(hs.attack||0).toFixed(1)}</b></div><div><span>Armor</span><b>${Number(hs.armor||0).toFixed(1)}</b></div></div><div class="detail-line"><span>Current story</span><b>${esc(D.quests[h.questId]?.name||'A quiet day')}</b></div><div class="detail-line"><span>Trust in your work</span><span>${h.relationship} ♥</span></div>${h.status==='recovering'?`<p class="small bad" data-rest="${h.id}">Resting for ${time(h.recoverUntil-s.simTime)}. Then back for better gear.</p>`:''}<div class="gear-tags">${Object.entries(h.equipment||{}).filter(([,i])=>i).map(([slot,i])=>`<span>${esc(D.recipes[i.recipeId]?.name||'Worn gear')} · Q${i.quality}</span>`).join('')||'<span>Starting out with worn gear</span>'}</div>${btn('Read their story','hero',h.id,{class:'small subtle',icon:'book'})}</article>`;}).join('')||'<section class="panel empty-state">Your first visitors are on their way.</section>'}</div><aside>${battleCard()}${commissions()}</aside></div>`;}

  function expeditions(){const s=game.state,quests=values(D.quests).filter(q=>s.unlocks.quests.includes(q.id));return head('THE ADVENTURE JOURNAL','A whole world beyond your doorstep.','Customers decide where to go. Better stocked shelves help them come home with better stories.')+`<div class="adventure-page"><div>${battleCard()}</div><div class="stack">${D.regions.filter(region=>quests.some(q=>q.regionId===region.id)).map(region=>`<section class="panel region-card"><span class="eyebrow">DISCOVERED REGION</span><h2>${esc(region.name)}</h2><p class="small muted">${esc(region.description)}</p>${quests.filter(q=>q.regionId===region.id).map(q=>`<div class="quest-row"><div><h3>${esc(q.name)}</h3><p>${time(q.baseSeconds*1000)} · ${s.questWins[q.id]||0} successful returns</p></div>${btn('Read','quest',q.id,{class:'small'})}</div>`).join('')}</section>`).join('')}<section class="panel"><div class="section-head"><h3>Stories brought home</h3><span class="pill">${s.stats.questsWon} wins · ${s.stats.questsLost} retreats</span></div>${s.runs.slice(-8).reverse().map(r=>`<div class="quest-row"><div><h3>${esc(D.quests[r.questId]?.name)}</h3><p>${r.heroIds.map(id=>esc(s.adventurers.find(h=>h.id===id)?.name||'Adventurer')).join(' & ')} · ${title(r.status)}</p></div>${btn('Watch','battle',r.id,{class:'small'})}</div>`).join('')||'<p class="small muted">The first adventure will appear here soon.</p>'}</section></div></div>`;}

  function upgrades(){const s=game.state;let body='';if(UI.upgradesTab==='staff'){body=`<div class="grid-2">${values(D.staff).filter(m=>player().level>=(m.requires?.level||1)).map(m=>{const hired=s.staff[m.id];const price=game.staffPrice(m.id);return `<section class="panel upgrade-card">${icon('people','upgrade-symbol')}<div class="row spread"><h3>${esc(m.name)}</h3>${hired?`<span class="pill live">Level ${hired.level||1}</span>`:''}</div><p>${esc(m.description)}</p>${effectList(m.effects)}<span class="tiny muted">${hired?'Learns through '+esc(m.work)+' work. '+(hired.active?'Currently working.':'On leave.'):'One-time contract · no wages · Smith level '+(m.requires?.level||1)}</span>${hired?btn(hired.active?'Give time off':'Return to work','staff-toggle',m.id):btn('Hire · '+num(price)+' g','staff-hire',m.id,{class:'primary',disabled:player().gold<price||player().level<(m.requires?.level||1)})}</section>`;}).join('')}</div>`;}else if(UI.upgradesTab==='decor'){body=`<div class="grid-2">${values(D.decor).map(x=>`<section class="panel upgrade-card">${icon('leaf','upgrade-symbol')}<h3>${esc(x.name)}</h3><p>${esc(x.description)}</p>${effectList(x.effects)}<span class="tiny muted">Kept through Legacy retirement</span>${btn(s.decorations.includes(x.id)?'Installed':'Install · '+num(x.cost)+' g','decorate',x.id,{class:'primary',disabled:s.decorations.includes(x.id)||player().gold<x.cost})}</section>`).join('')}</div>`;}else body=`<div class="grid-3">${values(D.upgrades).filter(x=>!(/requirement/i.test(game.upgradePreview(x.id).reason))).map(x=>{const p=game.upgradePreview(x.id);return `<section class="panel upgrade-card">${icon(x.effects?.lanes?'anvil':x.effects?.enchanting?'foci':x.effects?.partySize?'people':'tools','upgrade-symbol')}<div class="row spread"><h3>${esc(x.name)}</h3><span class="pill">${p.level} / ${p.maxLevel||x.maxLevel}</span></div><div class="level-dots">${Array.from({length:x.maxLevel},(_,i)=>`<i class="${i<p.level?'on':''}"></i>`).join('')}</div><p>${esc(x.description)}</p>${effectList(x.effects)}${p.reason&&!p.eligible?`<span class="tiny muted">${esc(p.reason)}</span>`:''}${btn(p.level>=x.maxLevel?'Fully improved':'Improve · '+num(p.cost)+' g','upgrade',x.id,{class:p.eligible?'primary':'',disabled:!p.eligible})}</section>`;}).join('')}</div>`;
    return head('Grow your workshop','Better tools. Better possibilities.','Improve the equipment, hire capable hands, and make this place your own.')+`<div class="chip-tabs">${[['stations','Stations & shop'],['staff','Apprentices & staff'],['decor','Shop character']].map(([id,label])=>`<button type="button" data-action="upgrades-tab" data-id="${id}" class="${UI.upgradesTab===id?'active':''}">${label}</button>`).join('')}</div>`+body;
  }
  function legacy(){const s=game.state,p=s.player,d=game.derived(),unlocked=p.legacy.generation>1;const branches=['force','artifice','commerce','lore'];return head('The family legacy','Some things outlast the forge.','Retire when you choose. Leave an heirloom, and teach the next generation what you learned.')+`<section class="legacy-hero">${icon('tree')}<div class="eyebrow">Generation ${p.legacy.generation}</div><h2 style="margin-top:9px">${unlocked?num(p.legacy.points)+' unspent Sparks':'A legacy begins with your first retirement'}</h2><p>Reach smith level 8 and win six quests to retire. Your next smith inherits permanent talents, collection history, decorations, and one chosen item with its recipe. Ordinary shop and quarry progress begin anew.</p><div class="row" style="justify-content:center"><span class="pill ${p.level>=8?'live':''}">Smith level ${p.level} / 8</span><span class="pill ${s.stats.questsWon>=6?'live':''}">Victories ${s.stats.questsWon} / 6</span><span class="pill gold">Retirement award: ${d.legacyReward} Sparks</span></div><div style="margin-top:20px">${btn('Plan retirement','retirement','',{class:'primary',icon:'tree',disabled:!d.legacyEligible})}</div></section><div class="grid-2">${branches.map(tree=>`<section class="panel talent-tree"><div class="row spread"><h3>${title(tree)}</h3><span class="tiny muted">Permanent lessons</span></div>${values(D.talents).filter(t=>(t.tree||t.branch||'').toLowerCase()===tree).map((t,index)=>{const owned=p.talents.includes(t.id);const eligible=unlocked&&!owned&&p.legacy.points>=t.cost&&(t.requires||[]).every(id=>p.talents.includes(id));return `<article class="talent-node ${owned?'owned':''}"><span class="node-dot">${owned?'✓':index+1}</span><h4>${esc(t.name)}</h4><p>${esc(t.description)}</p>${btn(owned?'Learned':t.cost+' '+(t.cost===1?'Spark':'Sparks'),'talent',t.id,{class:eligible?'primary':'',disabled:!eligible})}</article>`;}).join('')}</section>`).join('')}</div>`;}
  function journal(){const s=game.state;const body=UI.journalTab==='log'?`<section class="panel"><div class="log-list">${s.logs.map(l=>`<div class="log-entry"><time>${Math.floor(l.time/60000)}:${String(Math.floor(l.time/1000)%60).padStart(2,'0')}</time><p>${esc(l.text)}</p></div>`).join('')||'<p class="small muted">Your story begins with the first item.</p>'}</div></section>`:UI.journalTab==='proficiency'?`<div class="grid-3">${values(D.classes).map(c=>{const p=player().proficiency[c.id]||{level:0,xp:0};return `<section class="panel"><div class="row spread">${icon(c.id)}<span class="gold">${p.level} / 100</span></div><h3 style="margin:14px 0">${esc(c.name)}</h3>${meter(p.xp/(6+2*p.level)*100,'blue')}<p class="tiny muted" style="margin:10px 0">${num(p.xp)} / ${6+2*p.level} XP to the next point</p><p class="small muted">+${(p.level*.65).toFixed(1)} quality · +${(p.level*.6).toFixed(1)}% crafting speed contribution</p>${btn('Practice this craft','class',c.id,{class:'small',extra:'style="margin-top:15px"'})}</section>`;}).join('')}</div>`:`<div class="collection-grid">${values(D.recipes).filter(r=>player().legacy.collection[r.id]!==undefined||knownRecipes().some(k=>k.id===r.id)).map(r=>{const q=player().legacy.collection[r.id];return `<article class="collection-item ${q!==undefined?'known':''}">${icon(r.classId)}<h3>${esc(r.name)}</h3><p>${q!==undefined?'Best craftsmanship: '+q+' / 100':'Not yet crafted'}</p>${q>=85?'<span class="pill gold" style="margin-top:10px">Masterwork recorded</span>':''}</article>`;}).join('')}</div>`;
    return head('The chronicle','Every piece leaves a mark.','Collection records remain with the family, even when a new generation takes over.')+`<div class="chip-tabs">${[['collection','Collection'],['proficiency','Craft proficiencies'],['log','Workshop journal']].map(([id,name])=>`<button type="button" data-action="journal-tab" data-id="${id}" class="${UI.journalTab===id?'active':''}">${name}</button>`).join('')}</div>`+body;
  }
  function settings(){return head('Your workshop, your pace','Settings & saved progress','Progress stays on this browser. Export a copy before moving to another device.')+`<div class="grid-2"><section class="panel"><h3>Progress and recovery</h3><div class="setting-row"><div><b class="small">Export save</b><p>A complete portable copy of this workshop.</p></div>${btn('Export','export','',{icon:'save'})}</div><div class="setting-row"><div><b class="small">Import save</b><p>Review a save before replacing this workshop.</p></div>${btn('Choose file','import','')}</div><div class="setting-row"><div><b class="small">Local backup</b><p>Restore the previous automatic save.</p></div>${btn('Review backup','backup','')}</div><div class="setting-row"><div><b class="small">Offline progress</b><p>Your quarry, queued crafts and autonomous customers continue for up to eight hours. Assistant production follows your saved spending limits.</p></div></div>${UI.readOnly?btn('Use this tab','takeover','',{class:'primary'}):''}</section><section class="panel"><h3>Comfort and visibility</h3><div class="setting-row"><label><input type="checkbox" data-input="reduced" ${UI.reduced?'checked':''}> Reduced motion</label></div><div class="setting-row"><label><input type="checkbox" data-input="large" ${UI.large?'checked':''}> Larger supporting text</label></div><div class="setting-row"><div><b class="small">Attributes</b><p>Assign earned points or review a respec.</p></div>${btn('Open','attributes','')}</div><div class="setting-row"><div><b class="small">Production rules</b><p>Choose repeat recipes, supply spending limits and stock targets.</p></div>${btn('Configure','automation','')}</div><div class="setting-row"><a href="design/game-specification.html" target="_blank" rel="noopener">Read the full game specification ↗</a></div><p class="small muted" style="margin-top:18px">The local edition has no online account or connected cloud service. Export and import transfer progress between devices.</p></section></div>`;}
  function openModal(name,id){UI.modal=name;if(name==='item')UI.selectedItem=id;if(name==='hero')UI.selectedHero=id;if(name==='battle'){UI.selectedRun=id;UI.watchPinned=true;}if(name==='quest'){UI.selectedQuest=id;if(!UI.party.length){const hero=game.state.adventurers.find(h=>['browsing','ready'].includes(h.status));UI.party=hero?[hero.id]:[];}}renderModal();document.querySelector('.modal button:not(:disabled), .modal input')?.focus({preventScroll:true});}
  function modalShell(name,body,wide=false,closable=true){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" data-backdrop><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(name)}"><div class="modal-head"><div><h2>${name}</h2></div>${closable?btn(icon('close'),'close','',{class:'subtle',extra:'aria-label="Close dialog"'}):''}</div>${body}</section></div>`;paintTimers();paintBattle();mountScenes();}
  function renderModal(){const name=UI.modal;document.getElementById('app').inert=!!name;if(!name){document.getElementById('modal-root').innerHTML='';mountScenes();return;}const s=game.state,p=s.player,d=game.derived();
    if(name==='manage'){modalShell('Your workshop',`<p class="modal-intro">Grow your business, learn new skills and follow the people who use your work.</p><div class="manage-grid">${[['upgrades','tools','Upgrades','Better tools, more room and helping hands'],['adventurers','people','Customers','Their equipment, needs and stories'],['expeditions','map','World journal','Quests and previous adventures'],['journal','book','Craft journal','Proficiency and your collection'],['legacy','tree','Legacy','Build a lasting family tradition']].map(([id,i,name,sub])=>`<button data-action="nav" data-id="${id}">${art(i,34)}<span><b>${name}</b><small>${sub}</small></span>${icon('arrow')}</button>`).join('')}<button data-action="automation">${art('anvil',34)}<span><b>Production plan</b><small>Repeat crafting and material budgets</small></span>${icon('arrow')}</button></div>`);return;}
    if(name==='recipes'){modalShell('Choose your next craft',recipePicker(),true);return;}
    if(name==='stockroom'){modalShell('In your stockroom',stockroom());return;}
    if(name==='requests'){modalShell('Customer requests',commissions());return;}
    if(name==='quarry-manage'){modalShell('Improve the quarry',quarryManagement());return;}

  function paintTimers(){if(!game)return;const s=game.state;document.querySelectorAll('[data-job-progress]').forEach(el=>{const j=s.jobs.find(x=>x.id===el.dataset.jobProgress);if(j)el.firstElementChild.style.width=pct(j.status==='active'?(s.simTime-j.startedAt)/(j.duration||j.completeAt-j.startedAt)*100:0)+'%';});document.querySelectorAll('[data-job-time]').forEach(el=>{const j=s.jobs.find(x=>x.id===el.dataset.jobTime);if(j)el.textContent=j.status==='active'?time(j.completeAt-s.simTime):'Reserved';});document.querySelectorAll('[data-rest]').forEach(el=>{const h=s.adventurers.find(x=>x.id===el.dataset.rest);if(h)el.textContent='Resting for '+time(h.recoverUntil-s.simTime)+'. Will return for better equipment.';});const qd=game.quarryDerived();const goalNode=document.querySelector('[data-objective-detail]');if(goalNode&&(s.jobs.length||!qd.manualReady)&&goalNode.dataset.second!==String(Math.floor(s.simTime/1000))){goalNode.dataset.second=String(Math.floor(s.simTime/1000));if(window.EIFlow)goalNode.textContent=EIFlow.next(game,D,{recipeId:UI.recipe}).detail;}document.querySelectorAll('[data-quarry-progress]').forEach(el=>el.firstElementChild.style.width=pct(qd.progress*100)+'%');document.querySelectorAll('[data-quarry-time]').forEach(el=>el.textContent=time(s.quarry.nextYieldAt-s.simTime));document.querySelectorAll('[data-mining-status]').forEach(el=>el.textContent=qd.manualReady?'You can gather every 5 seconds.':'Next gathering in '+time(s.quarry.nextManualAt-s.simTime));document.querySelectorAll('[data-mine-button]').forEach(el=>{el.disabled=!qd.manualReady||UI.readOnly;});}
  function paintBattle(){if(!game)return;document.querySelectorAll('[data-battle-view]').forEach(el=>{const view=game.battleView(el.dataset.battleView);if(!view)return;const run=game.state.runs.find(r=>r.id===view.id),large=el.hasAttribute('data-large-battle'),events=(view.events||[]).slice(large?-12:-2).reverse(),hp=h=>Math.max(0,Math.ceil(h.hp||0));const health=arr=>arr.map(h=>`<div class="battle-hp"><div><b>${esc(h.name)}</b><span>${hp(h)}/${Math.ceil(h.maxHp||h.maxHealth||1)}</span></div>${meter(hp(h)/(h.maxHp||h.maxHealth||1)*100,arr===view.heroes?'health':'enemy')}</div>`).join('');const text=`<div class="battle-status"><span class="status-dot ${view.victory===false?'defeat':''}"></span><b>${run?.status==='pending'?'Waiting for storage':view.victory===true?'A happy return!':view.victory===false?'Home to recover':title(view.status)}</b><span>${run?.status==='complete'?'Story recorded':run?.status==='pending'?'At the shop':time(view.returnIn||0)}</span></div><div class="hp-pair">${health(view.heroes||[])}${health(view.enemies||[])}</div><div class="battle-log">${run?.status==='pending'?'<p>Free some material space to receive these rewards. Your adventurers will unpack them automatically.</p>':events.length?events.map(e=>`<p>${esc(e.text||e.message||'An exchange of blows.')}</p>`).join(''):'<p>A little courage, and a good blade.</p>'}</div>`;if(el._lastText!==text){el.innerHTML=text;el._lastText=text;}});}
  document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el||el.disabled||!game)return;event.preventDefault();const action=el.dataset.action,id=el.dataset.id;const s=game.state;

      case'hero-quest':{const h=s.adventurers.find(h=>h.id===id);UI.party=[id];openModal('quest',UI.heroQuest||h.questId);break;}
      case'quest':UI.party=[];openModal('quest',id);break;
      case'dispatch':if(act('dispatch',{questId:id,heroIds:UI.party}).ok){UI.modal=null;UI.selectedRun=s.runs[s.runs.length-1]?.id;UI.view='workshop';render();renderModal();}break;
      case'battle':openModal('battle',id);break;
      case'route':act('route',{questId:el.dataset.quest,choiceId:id});renderModal();break;
      case'upgrades-tab':UI.upgradesTab=id;render();break;
      case'upgrade':act('upgrade',{upgradeId:id});break;
      case'staff-hire':act('hireStaff',{staffId:id});break;
      case'staff-toggle':act('toggleStaff',{staffId:id});break;
      case'decorate':act('decorate',{decorId:id});break;
      case'talent':act('talent',{talentId:id});break;
      case'journal-tab':UI.journalTab=id;render();break;
      case'automation':openModal('automation');break;
      case'save-automation':{const payload={};document.querySelectorAll('[data-auto]').forEach(input=>payload[input.dataset.auto]=input.type==='checkbox'?input.checked:input.type==='number'?Number(input.value):input.value||null);if(act('automation',payload).ok){UI.modal=null;renderModal();}break;}
      case'retirement':openModal('retirement');break;
      case'confirm-retire':{const heirloomItemId=document.getElementById('heirloom-choice')?.value||null;if(act('retire',{heirloomItemId,confirmed:true}).ok){UI.modal=null;UI.selectedItem=null;UI.selectedHero=null;UI.selectedRun=null;UI.watchPinned=false;UI.party=[];UI.view='legacy';if(!game.state.started)UI.modal='create';render();renderModal();}break;}
      case'mailbox':openModal('mailbox');break;
      case'claim':act('claim',{bundleId:id});renderModal();break;
      case'reclaim':act('reclaim');break;
      case'commission-accept':act('acceptCommission',{commissionId:id});break;
      case'commission-deliver':act('fulfillCommission',{commissionId:id,itemId:el.dataset.item});break;
      case'takeover':{const raw=storageGet(SAVE);if(raw){const result=game.importSave(raw);if(!result.ok){toast('The latest save could not be loaded. Export or reload before taking control.',true);break;}}claimLease(true);game.advanceOffline(Date.now());lastTick=Date.now();UI.modal=game.state.started?null:'create';save(true);render();renderModal();toast('This tab now controls the latest saved workshop.');break;}
      case'export':{save(true);const blob=new Blob([game.exportSave()],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ember-and-iron-generation-'+player().legacy.generation+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Save exported.');break;}
      case'import':document.getElementById('import-file').click();break;
      case'backup':{const raw=storageGet(BACKUP);const result=raw&&EIEngine.validateSave(raw,D);if(!result?.ok)toast('No valid backup is available.',true);else{UI.importText=raw;openModal('confirm-import');}break;}
      case'confirm-import':{if(UI.readOnly){toast('Take control of this tab first.',true);break;}const result=game.importSave(UI.importText);toast(result.message,!result.ok);if(result.ok){UI.modal=game.state.started?null:'create';UI.view='workshop';UI.party=[];UI.selectedRun=null;UI.watchPinned=false;lastTick=Date.now();game.advanceOffline(Date.now());save(true);render();renderModal();}break;}
    }
  });
  document.addEventListener('input',event=>{const el=event.target;if(el.dataset.input==='shopName')UI.setupName=el.value;if(el.dataset.input==='recipeSearch'){UI.search=el.value;if(UI.modal==='recipes'){const pos=el.selectionStart;renderModal();const input=document.querySelector('[data-input=recipeSearch]');input?.focus();input?.setSelectionRange(pos,pos);}else render();}});
  document.addEventListener('change',event=>{const el=event.target,key=el.dataset.input;if(el.dataset.party){if(el.checked)UI.party.push(el.dataset.party);else UI.party=UI.party.filter(id=>id!==el.dataset.party);renderModal();return;}if(!key||!game)return;switch(key){case'classFilter':UI.classFilter=el.value;if(UI.modal==='recipes')renderModal();else render();break;case'quantity':UI.quantity=Number(el.value);render();break;case'inventoryFilter':UI.inventoryFilter=el.value;render();break;case'watchedRun':UI.watchPinned=el.value!=='auto';UI.selectedRun=UI.watchPinned?el.value:null;render();break;case'deposit':act('quarryDeposit',{materialId:el.value});break;case'itemHero':UI.itemHero=el.value;renderModal();break;case'heroQuest':UI.heroQuest=el.value;break;case'reduced':case'large':UI[key]=el.checked;document.body.classList.toggle(key==='reduced'?'reduce-motion':'large-text',el.checked);storageSet(SAVE+'-preferences',JSON.stringify({reduced:UI.reduced,large:UI.large}));break;}});
  document.getElementById('import-file').addEventListener('change',async event=>{const file=event.target.files?.[0];if(!file)return;if(file.size>12000000){toast('That save file is too large.',true);return;}const text=await file.text();const result=EIEngine.validateSave(text,D);if(!result.ok){toast(result.message,true);return;}UI.importText=text;openModal('confirm-import');event.target.value='';});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.modal&&UI.modal!=='create'){UI.modal=null;renderModal();}if(e.key==='Tab'&&UI.modal){const modal=document.querySelector('.modal'),nodes=modal?.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),a[href]');if(!nodes?.length)return;const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
  window.addEventListener('storage',e=>{if(e.key===LEASE){let lease;try{lease=JSON.parse(e.newValue||'null');}catch(_){}if(lease&&lease.owner!==owner){UI.readOnly=true;leaseOwned=false;UI.force=true;}}});
  window.addEventListener('pagehide',()=>{save(true);if(leaseOwned){try{const lease=JSON.parse(localStorage.getItem(LEASE)||'null');if(lease?.owner===owner)localStorage.removeItem(LEASE);}catch(_){}}});
  document.addEventListener('visibilitychange',()=>save(true));
  document.addEventListener('toggle',event=>{const key=event.target.dataset?.persistDetails;if(key)UI[key]=event.target.open;},true);
  init();
  requestAnimationFrame(animateScenes);
})();



</script>
</body>
