lId)?'':'disabled'} value="${x.materialId}" ${x.materialId===s.quarry.activeDeposit?'selected':''}>${esc(x.name)}</option>`).join('')}</select>${btn('Mine bronze','mine','bronze',{icon:'mine',disabled:!qd.manualReady,extra:'data-mine-button'})}${btn('Gather fuel','mine','fuel',{class:'small',disabled:!qd.manualReady,extra:'data-mine-button'})}</div><div class="chip-tabs">${[['upgrades','Improvements'],['workers','Quarry workers']].map(([id,label])=>`<button type="button" class="${UI.quarryTab===id?'active':''}" data-action="quarry-tab" data-id="${id}">${label}</button>`).join('')}</div><div class="grid-3">${list.map(x=>{const worker=UI.quarryTab==='workers';const p=game.quarryPreview(x.id,worker?'worker':'upgrade');return `<section class="panel upgrade-card">${icon(worker?'people':'mine','upgrade-symbol')}<div class="row spread"><h3>${esc(x.name)}</h3><span class="pill">${p.level||0} / ${p.maxLevel||x.maxLevel}</span></div><p>${esc(x.description)}</p>${effectList(x.effects).replaceAll('craft speed','extraction speed')}${p.reason&&!p.eligible?`<span class="tiny muted">${esc(p.reason)}</span>`:''}${btn(`${worker?'Hire / improve':'Improve'} · ${num(p.cost)} g`,worker?'quarry-worker':'quarry-upgrade',x.id,{class:p.eligible?'primary':'',disabled:!p.eligible})}</section>`;}).join('')}</div><div class="hint-box">Every material tier has its own equipment profiles. Iron produces more powerful items than bronze, while skilled craftsmanship can keep a familiar weapon useful. Wood and leather come from suppliers and quest returns.</div>`;}
  function inventory(){const s=game.state,d=game.derived();const list=s.inventory.filter(i=>UI.inventoryFilter==='all'||D.recipes[i.recipeId]?.classId===UI.inventoryFilter);return head('Stockroom & suppliers','Work worth keeping.','Sell to a suitable adventurer, reserve a future heirloom, or restock your materials.',btn('Suppliers','market','',{icon:'coins',class:'small'}))+resources()+`<div class="row spread" style="margin-bottom:20px"><div class="row"><span class="small muted">${s.inventory.length} / ${d.storageCapacity} finished pieces</span><select aria-label="Inventory class" data-input="inventoryFilter"><option value="all">All equipment</option>${values(D.classes).map(c=>`<option ${UI.inventoryFilter===c.id?'selected':''} value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>${btn('Collect deliveries'+(s.mailbox.length?' · '+s.mailbox.length:''),'mailbox','',{class:'small'})}</div><div class="inventory-list">${list.length?list.map(i=>{const r=D.recipes[i.recipeId];return `<article class="inventory-row">${icon(r.classId)}<div><h3>${esc(itemName(i))}${i.protected?' · ♧':''}</h3><div class="item-meta"><span>${grade(i.quality)} · Q${i.quality}</span><span>${className(r.classId)}</span><span class="gold">${num(game.itemPrice(i.id))} g</span><span>${i.displayed?'On display':'In storage'}</span></div></div><div class="row">${btn('Inspect / sell','item',i.id,{class:'small primary'})}${btn(i.protected?'Unprotect':'Protect','protect',i.id,{class:'small subtle'})}</div></article>`;}).join(''):`<div class="panel empty-state">${icon('box')}<h3>Your shelves are waiting</h3><p>Completed crafts appear here. Displayed equipment shapes the customers who visit.</p>${btn('Return to the forge','nav','workshop',{class:'primary'})}</div>`}</div><section class="panel" style="margin-top:25px"><div class="section-head"><div><h3>Common supplies</h3><p>The quarry supplies your metal. Keep wood, leather and fuel on hand.</p></div></div>${marketItems(['wood','leather','fuel','bronze'])}<div class="hint-box">Out of funds and fittings? The village can supply emergency wood or leather for one basic craft. Sell surplus material to free storage first. ${btn('Request spare fittings','reclaim','',{class:'small'})}</div></section>`;}
  function marketItems(ids){return `<div class="market-grid">${ids.filter(id=>D.materials[id]).map(id=>{const m=D.materials[id],cost=game.materialPrice(id),available=game.materialAvailable(id),held=game.state.materials[id]||0,qty=Math.min(5,held);return `<div class="market-item"><div class="row spread"><h3>${esc(m.name)}</h3><span class="tiny muted">${num(held)} held</span></div><span class="tiny muted">${Number.isFinite(cost)?available?num(cost)+' gold per unit':'Supplier locked · advance your smith or quests':'Found through exploration'}</span><div class="row">${btn('Buy 1','material',id,{class:'small',disabled:!available||player().gold<cost,extra:'data-quantity="1"'})}${btn('Buy 5','material',id,{class:'small',disabled:!available||player().gold<cost*5,extra:'data-quantity="5"'})}${Number.isFinite(m.price)&&qty?btn('Sell '+qty+' · '+Math.max(1,Math.floor(m.price*qty*.5))+' g','sell-material',id,{class:'small subtle',extra:'data-quantity="'+qty+'"'}):''}</div></div>`;}).join('')}</div>`;}
  function itemName(i){const r=D.recipes[i.recipeId];return `${i.affixId?D.affixes[i.affixId]?.name+' ':''}${r?.name||'Unknown item'}${i.enchantmentId?' · '+(D.enchantments[i.enchantmentId]?.name||'Enchanted'):''}`;}
  function combatDetails(stats,twoHanded){const labels={attack:'Attack',health:'Health',armor:'Armor',interval:'Attack interval',crit:'Critical chance',evasion:'Evasion',block:'Block chance',armorPen:'Armor penetration',lifesteal:'Lifesteal'};return `<div class="gear-tags">${Object.entries(stats).filter(([k,v])=>labels[k]&&Number.isFinite(v)&&v!==0).map(([k,v])=>`<span>${labels[k]}: ${['crit','evasion','block','lifesteal'].includes(k)?Math.round(v*100)+'%':Number(v).toFixed(1)+(k==='interval'?'s':'')}</span>`).join('')}${stats.damageType?`<span>${esc(title(stats.damageType))} damage</span>`:''}${twoHanded?'<span>Two-handed · blocks offhand</span>':''}${Object.entries(stats.resistances||{}).filter(([,v])=>v>0).map(([k,v])=>`<span>${esc(title(k))} resistance: ${Math.round(v*100)}%</span>`).join('')}</div>`;}
  function commissions(){const s=game.state,orders=s.commissions||[];return `<section class="panel" style="margin-top:24px"><div class="section-head"><div><h3>Commission ledger</h3><p>At 5, 15 and 30 trust, a customer sends a gift and requests a signature piece. Orders have no deadline.</p></div><span class="pill">${orders.filter(c=>c.status==='complete').length} fulfilled</span></div>${orders.length?orders.slice().reverse().map(c=>{const hero=s.adventurers.find(h=>h.id===c.heroId),preview=game.commissionPreview(c.id),item=preview.items.find(i=>i.id===preview.candidateItemId);return `<div class="quest-row"><div><h3>${esc(hero?.name||'Customer')} · ${esc(c.name)}</h3><p>${esc(className(c.classId))} · Tier ${c.minTier}+ · Quality ${c.minQuality}+ · ${Math.round((c.premium-1)*100)}% premium${c.bonusGold?' + '+c.bonusGold+' g':''}</p><p>${c.status==='complete'?'Delivered and equipped':item?'Selected: '+esc(itemName(item))+' · Q'+item.quality+' · '+preview.payment+' g':esc(preview.reason)}</p></div>${c.status==='complete'?'<span class="pill live">Complete</span>':c.status==='offered'?btn('Accept order','commission-accept',c.id,{class:'small'}):btn('Deliver piece','commission-deliver',c.id,{class:'small primary',disabled:!preview.eligible,extra:'data-item="'+(preview.candidateItemId||'')+'"'})}</div>`;}).join(''):'<p class="small muted">Build trust through equipment sales and expeditions. Your first named commission appears at 5 trust.</p>'}</section>`;}
  function effectList(effects){const labels={quality:'quality',heavyQuality:'heavy quality',speed:'craft speed',capacity:'item capacity',materialCapacity:'material capacity',queue:'queue slots',lanes:'production lanes',display:'display slots',partySize:'party members',expeditions:'expedition slots',arrival:'arrival rate',sale:'sale value',budget:'customer budget',staffDiscount:'staff discount',materialDiscount:'supply discount',proficiencyXp:'proficiency XP',heroXp:'adventurer XP',loot:'quest loot',proficiencyGateReduction:'proficiency gate reduction',affixChance:'affix chance',enchant:'enchantment strength',attack:'item attack',heirloomCombat:'heirloom power',partySynergy:'party synergy',startStrength:'starting Strength',startGold:'starting gold',startProficiency:'starting proficiency',yield:'extraction yield',automation:'automation access',enchanting:'enchanting access'};return `<div class="effect-list">${Object.entries(effects||{}).filter(([k,v])=>typeof v==='number'&&v!==0).map(([k,v])=>`<span>+${Math.abs(v)<1?Math.round(v*100)+'%':v} ${esc(labels[k]||title(k))}</span>`).join('')}</div>`;}
  function adventurers(){const s=game.state;return head('The adventurers','People behind the purchases.','Their equipment, experience and scars stay with them. A defeat is a reason to prepare again.')+`<div class="grid-3">${s.adventurers.map(h=>{const hs=game.heroStats(h.id)||{},a=D.archetypes[h.archetypeId];const available=['browsing','ready'].includes(h.status);return `<article class="panel hero-card"><div class="person"><span class="avatar">${esc(h.name[0])}</span><div><b>${esc(h.name)}</b><small>${esc(a?.name)} · Level ${h.level}</small></div><span class="pill ${available?'live':''}" style="margin-left:auto">${esc(title(h.status))}</span></div><p class="small muted">${esc(a?.description||('Specializes in '+(a?.preferences||[]).map(className).join(', ')+'.'))}</p><div class="item-values"><div><span>Health</span><b>${num(hs.health)}</b></div><div><span>Attack</span><b>${Number(hs.attack||0).toFixed(1)}</b></div><div><span>Armor</span><b>${Number(hs.armor||0).toFixed(1)}</b></div></div><div class="detail-line"><span>Relationship</span><span>${h.relationship||0} trust</span></div><div class="detail-line"><span>Quest</span><span>${esc(D.quests[h.questId]?.name||'Seeking adventure')}</span></div><div class="detail-line"><span>Budget</span><span class="gold">${num(h.budget)} g</span></div>${h.failures?`<div class="detail-line"><span>Defeats remembered</span><span class="bad">${h.failures}</span></div>`:''}${h.status==='recovering'?`<p class="small bad" data-rest="${h.id}">Resting for ${time(h.recoverUntil-s.simTime)}. Will return for better equipment.</p>`:''}<div class="gear-tags">${Object.entries(h.equipment||{}).map(([slot,item])=>`<span>${title(slot)}: ${item?esc(D.recipes[item.recipeId]?.name||'Worn gear'):'Worn / empty'}</span>`).join('')}</div>${btn('Inspect & choose quest','hero',h.id,{class:'full',icon:'arrow'})}${available?btn('Find an upgrade','customer',h.id,{class:'small subtle'}):''}</article>`;}).join('')}</div>${!s.adventurers.length?'<div class="empty-state">The first visitors will arrive when the shop opens.</div>':''}<div class="hint-box">Stocked classes attract matching customers. Failed adventurers rest, return looking for an upgrade, and can retry or take an easier contract. Parties unlock through the Guild hall.</div>${commissions()}`;}
  function expeditions(){const s=game.state;return head('The frontier','Every blade has a destination.','Match the equipment to the encounter. Check the forecast before risking another setback.')+`<div class="grid-2">${D.regions.map((region,index)=>{const quests=values(D.quests).filter(q=>q.regionId===region.id);const locked=quests.every(q=>!s.unlocks.quests.includes(q.id));return `<section class="panel region-card ${locked?'locked':''}"><div class="region-head"><span class="region-number">${String(index+1).padStart(2,'0')}</span><div><h2>${esc(region.name)}</h2><p class="small muted">${esc(region.description||'')}</p></div></div>${quests.map(q=>`<div class="quest-row"><div><h3>${esc(q.name)} ${q.boss?'✦':''}</h3><p>${time(q.baseSeconds*1000)} · ${(q.requires?.partySize||1)>1?q.requires.partySize+' heroes required':'Solo or party'}${s.questWins[q.id]?' · '+s.questWins[q.id]+' victories':''}</p></div>${btn(s.unlocks.quests.includes(q.id)?'Prepare':'Inspect','quest',q.id,{class:'small',icon:s.unlocks.quests.includes(q.id)?'arrow':'lock'})}</div>`).join('')}</section>`;}).join('')}</div>${s.runs.length?`<section class="panel" style="margin-top:23px"><div class="section-head"><h3>Expedition journal</h3><span class="small muted">${s.stats.questsWon} won · ${s.stats.questsLost} retreats</span></div>${s.runs.slice(-10).reverse().map(r=>`<div class="quest-row"><div><h3>${esc(D.quests[r.questId]?.name)}</h3><p>${r.heroIds.map(id=>esc(s.adventurers.find(h=>h.id===id)?.name||'Adventurer')).join(', ')} · ${title(r.status)}</p></div>${btn('Watch / report','battle',r.id,{class:'small'})}</div>`).join('')}</section>`:''}`;}
  function upgrades(){const s=game.state;let body='';if(UI.upgradesTab==='staff'){body=`<div class="grid-2">${values(D.staff).map(m=>{const hired=s.staff[m.id];const price=game.staffPrice(m.id);return `<section class="panel upgrade-card">${icon('people','upgrade-symbol')}<div class="row spread"><h3>${esc(m.name)}</h3>${hired?`<span class="pill live">Level ${hired.level||1}</span>`:''}</div><p>${esc(m.description)}</p>${effectList(m.effects)}<span class="tiny muted">${hired?'Learns through '+esc(m.work)+' work. '+(hired.active?'Currently working.':'On leave.'):'One-time contract · no wages · Smith level '+(m.requires?.level||1)}</span>${hired?btn(hired.active?'Give time off':'Return to work','staff-toggle',m.id):btn('Hire · '+num(price)+' g','staff-hire',m.id,{class:'primary',disabled:player().gold<price||player().level<(m.requires?.level||1)})}</section>`;}).join('')}</div>`;}else if(UI.upgradesTab==='decor'){body=`<div class="grid-2">${values(D.decor).map(x=>`<section class="panel upgrade-card">${icon('leaf','upgrade-symbol')}<h3>${esc(x.name)}</h3><p>${esc(x.description)}</p>${effectList(x.effects)}<span class="tiny muted">Kept through Legacy retirement</span>${btn(s.decorations.includes(x.id)?'Installed':'Install · '+num(x.cost)+' g','decorate',x.id,{class:'primary',disabled:s.decorations.includes(x.id)||player().gold<x.cost})}</section>`).join('')}</div>`;}else body=`<div class="grid-3">${values(D.upgrades).map(x=>{const p=game.upgradePreview(x.id);return `<section class="panel upgrade-card">${icon(x.effects?.lanes?'anvil':x.effects?.enchanting?'foci':x.effects?.partySize?'people':'tools','upgrade-symbol')}<div class="row spread"><h3>${esc(x.name)}</h3><span class="pill">${p.level} / ${p.maxLevel||x.maxLevel}</span></div><div class="level-dots">${Array.from({length:x.maxLevel},(_,i)=>`<i class="${i<p.level?'on':''}"></i>`).join('')}</div><p>${esc(x.description)}</p>${effectList(x.effects)}${p.reason&&!p.eligible?`<span class="tiny muted">${esc(p.reason)}</span>`:''}${btn(p.level>=x.maxLevel?'Fully improved':'Improve · '+num(p.cost)+' g','upgrade',x.id,{class:p.eligible?'primary':'',disabled:!p.eligible})}</section>`;}).join('')}</div>`;
    return head('Grow your workshop','Better tools. Better possibilities.','Improve the equipment, hire capable hands, and make this place your own.')+`<div class="chip-tabs">${[['stations','Stations & shop'],['staff','Apprentices & staff'],['decor','Shop character']].map(([id,label])=>`<button type="button" data-action="upgrades-tab" data-id="${id}" class="${UI.upgradesTab===id?'active':''}">${label}</button>`).join('')}</div>`+body;
  }
  function legacy(){const s=game.state,p=s.player,d=game.derived(),unlocked=p.legacy.generation>1;const branches=['force','artifice','commerce','lore'];return head('The family legacy','Some things outlast the forge.','Retire when you choose. Leave an heirloom, and teach the next generation what you learned.')+`<section class="legacy-hero">${icon('tree')}<div class="eyebrow">Generation ${p.legacy.generation}</div><h2 style="margin-top:9px">${unlocked?num(p.legacy.points)+' unspent Sparks':'A legacy begins with your first retirement'}</h2><p>Reach smith level 8 and win six quests to retire. Your next smith inherits permanent talents, collection history, decorations, and one chosen item with its recipe. Ordinary shop and quarry progress begin anew.</p><div class="row" style="justify-content:center"><span class="pill ${p.level>=8?'live':''}">Smith level ${p.level} / 8</span><span class="pill ${s.stats.questsWon>=6?'live':''}">Victories ${s.stats.questsWon} / 6</span><span class="pill gold">Retirement award: ${d.legacyReward} Sparks</span></div><div style="margin-top:20px">${btn('Plan retirement','retirement','',{class:'primary',icon:'tree',disabled:!d.legacyEligible})}</div></section><div class="grid-2">${branches.map(tree=>`<section class="panel talent-tree"><div class="row spread"><h3>${title(tree)}</h3><span class="tiny muted">Permanent lessons</span></div>${values(D.talents).filter(t=>(t.tree||t.branch||'').toLowerCase()===tree).map((t,index)=>{const owned=p.talents.includes(t.id);const eligible=unlocked&&!owned&&p.legacy.points>=t.cost&&(t.requires||[]).every(id=>p.talents.includes(id));return `<article class="talent-node ${owned?'owned':''}"><span class="node-dot">${owned?'✓':index+1}</span><h4>${esc(t.name)}</h4><p>${esc(t.description)}</p>${btn(owned?'Learned':t.cost+' '+(t.cost===1?'Spark':'Sparks'),'talent',t.id,{class:eligible?'primary':'',disabled:!eligible})}</article>`;}).join('')}</section>`).join('')}</div>`;}
  function journal(){const s=game.state;const body=UI.journalTab==='log'?`<section class="panel"><div class="log-list">${s.logs.map(l=>`<div class="log-entry"><time>${Math.floor(l.time/60000)}:${String(Math.floor(l.time/1000)%60).padStart(2,'0')}</time><p>${esc(l.text)}</p></div>`).join('')||'<p class="small muted">Your story begins with the first item.</p>'}</div></section>`:UI.journalTab==='proficiency'?`<div class="grid-3">${values(D.classes).map(c=>{const p=player().proficiency[c.id]||{level:0,xp:0};return `<section class="panel"><div class="row spread">${icon(c.id)}<span class="gold">${p.level} / 100</span></div><h3 style="margin:14px 0">${esc(c.name)}</h3>${meter(p.xp/(6+2*p.level)*100,'blue')}<p class="tiny muted" style="margin:10px 0">${num(p.xp)} / ${6+2*p.level} XP to the next point</p><p class="small muted">+${(p.level*.65).toFixed(1)} quality · +${(p.level*.6).toFixed(1)}% crafting speed contribution</p>${btn('Practice this craft','class',c.id,{class:'small',extra:'style="margin-top:15px"'})}</section>`;}).join('')}</div>`:`<div class="collection-grid">${values(D.recipes).map(r=>{const q=player().legacy.collection[r.id];return `<article class="collection-item ${q!==undefined?'known':''}">${icon(r.classId)}<h3>${esc(r.name)}</h3><p>${q!==undefined?'Best craftsmanship: '+q+' / 100':'Not yet crafted'}</p>${q>=85?'<span class="pill gold" style="margin-top:10px">Masterwork recorded</span>':''}</article>`;}).join('')}</div>`;
    return head('The chronicle','Every piece leaves a mark.','Collection records remain with the family, even when a new generation takes over.')+`<div class="chip-tabs">${[['collection','Collection'],['proficiency','Craft proficiencies'],['log','Workshop journal']].map(([id,name])=>`<button type="button" data-action="journal-tab" data-id="${id}" class="${UI.journalTab===id?'active':''}">${name}</button>`).join('')}</div>`+body;

  function settings(){return head('Your workshop, your pace','Settings & saved progress','Progress stays on this browser. Export a copy before moving to another device.')+`<div class="grid-2"><section class="panel"><h3>Progress and recovery</h3><div class="setting-row"><div><b class="small">Export save</b><p>A complete portable copy of this workshop.</p></div>${btn('Export','export','',{icon:'save'})}</div><div class="setting-row"><div><b class="small">Import save</b><p>Review a save before replacing this workshop.</p></div>${btn('Choose file','import','')}</div><div class="setting-row"><div><b class="small">Local backup</b><p>Restore the previous automatic save.</p></div>${btn('Review backup','backup','')}</div><div class="setting-row"><div><b class="small">Offline progress</b><p>Queued work, quarry production and current quests progress for up to eight hours. Automation follows your saved limits.</p></div></div>${UI.readOnly?btn('Use this tab','takeover','',{class:'primary'}):''}</section><section class="panel"><h3>Comfort and visibility</h3><div class="setting-row"><label><input type="checkbox" data-input="reduced" ${UI.reduced?'checked':''}> Reduced motion</label></div><div class="setting-row"><label><input type="checkbox" data-input="large" ${UI.large?'checked':''}> Larger supporting text</label></div><div class="setting-row"><div><b class="small">Attributes</b><p>Assign earned points or review a respec.</p></div>${btn('Open','attributes','')}</div><div class="setting-row"><div><b class="small">Production rules</b><p>Choose spending limits, stock targets, and automatic sales.</p></div>${btn('Configure','automation','')}</div><div class="setting-row"><a href="design/game-specification.html" target="_blank" rel="noopener">Read the full game specification ↗</a></div><p class="small muted" style="margin-top:18px">The local edition has no online account or connected cloud service. Export and import transfer progress between devices.</p></section></div>`;}

  function paintTimers(){if(!game)return;const s=game.state;document.querySelectorAll('[data-job-progress]').forEach(el=>{const j=s.jobs.find(x=>x.id===el.dataset.jobProgress);if(j)el.firstElementChild.style.width=pct(j.status==='active'?(s.simTime-j.startedAt)/(j.duration||j.completeAt-j.startedAt)*100:0)+'%';});document.querySelectorAll('[data-job-time]').forEach(el=>{const j=s.jobs.find(x=>x.id===el.dataset.jobTime);if(j)el.textContent=j.status==='active'?time(j.completeAt-s.simTime):'Reserved';});document.querySelectorAll('[data-rest]').forEach(el=>{const h=s.adventurers.find(x=>x.id===el.dataset.rest);if(h)el.textContent='Resting for '+time(h.recoverUntil-s.simTime)+'. Will return for better equipment.';});const qd=game.quarryDerived();document.querySelectorAll('[data-quarry-progress]').forEach(el=>el.firstElementChild.style.width=pct(qd.progress*100)+'%');document.querySelectorAll('[data-quarry-time]').forEach(el=>el.textContent=time(s.quarry.nextYieldAt-s.simTime));document.querySelectorAll('[data-mine-button]').forEach(el=>{el.disabled=!qd.manualReady||UI.readOnly;});}
  function paintBattle(){if(!game)return;document.querySelectorAll('[data-battle-view]').forEach(el=>{const view=game.battleView(el.dataset.battleView);if(!view)return;const run=game.state.runs.find(x=>x.id===view.id);const q=D.quests[run?.questId];const heroes=view.heroes||[],enemies=view.enemies||[];const large=el.hasAttribute('data-large-battle');const hp=(h)=>h.hp??h.currentHealth??h.health??0;const max=(h)=>h.maxHealth??h.health??h.maxHp??hp(h);const healthRows=arr=>arr.map(h=>`<div><div class="health-label"><span>${esc(h.name||'Combatant')}</span><span>${Math.max(0,Math.ceil(hp(h)))} / ${Math.ceil(max(h))}</span></div>${meter(max(h)?hp(h)/max(h)*100:0,arr===heroes?'health':'enemy')}</div>`).join('');const result=view.victory===true?'Victory':view.victory===false?'Retreat':title(view.status);const events=(view.events||[]).slice(large?-22:-3).reverse();el.innerHTML=`<div class="battle-scene"><div class="eyebrow">${esc(q?.name||'Expedition')} · ${esc(result)}</div><div class="battle-versus"><div class="combatant">${icon('shields')}<b>${esc(heroes.map(h=>h.name).join(' & ')||'Adventurer')}</b></div><span class="eyebrow">VS</span><div class="combatant enemy">${icon('skull')}<b>${esc(enemies.map(h=>h.name).join(' & ')||'The frontier')}</b></div></div><div class="hp-pair"><div class="stack">${healthRows(heroes)}</div><div class="stack">${healthRows(enemies)}</div></div></div><div class="row spread tiny muted"><span>${run?.status==='complete'?'Returned to the shop':title(view.status)}</span><span>${run?.status==='complete'?'Result recorded':time(view.returnIn||0)+' until return'}</span></div>${meter((view.progress||0)*100,'blue')}<div class="battle-log">${events.length?events.map(e=>`<p>${esc(e.text||e.message||`${e.actor||'Combatant'} dealt ${Number(e.damage||0).toFixed(1)} damage`)}</p>`).join(''):'<p>Travelling to the encounter. Your forge continues working.</p>'}</div>`;});}
  document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el||el.disabled||!game)return;event.preventDefault();const action=el.dataset.action,id=el.dataset.id;const s=game.state;
    switch(action){
      case'nav':UI.view=id;UI.modal=null;UI.selectedHero=id==='inventory'?UI.selectedHero:null;render();renderModal();window.scrollTo({top:0,behavior:'instant'});break;
      case'more':openModal('more');break;
      case'close':UI.modal=null;renderModal();break;
      case'recipe':UI.recipe=id;render();break;
      case'class':UI.classFilter=id;UI.recipe=values(D.recipes).find(r=>r.classId===id)?.id||UI.recipe;UI.view='workshop';render();break;
      case'preset':UI.setupStats=({balanced:{strength:4,precision:4,charisma:4,knowledge:4},forge:{strength:6,precision:4,charisma:2,knowledge:4},precision:{strength:3,precision:6,charisma:3,knowledge:4},merchant:{strength:3,precision:3,charisma:6,knowledge:4}})[id];renderModal();break;
      case'setup-plus':if(values(UI.setupStats).reduce((a,b)=>a+b,0)<16&&UI.setupStats[id]<6)UI.setupStats[id]++;renderModal();break;
      case'setup-minus':if(UI.setupStats[id]>2)UI.setupStats[id]--;renderModal();break;
      case'begin':{const r=act('create',{name:UI.setupName.trim()||'Ember & Iron',stats:UI.setupStats});if(r.ok){UI.modal=null;lastTick=Date.now();save(true);render();renderModal();}break;}
      case'craft':act('craft',{recipeId:id,quantity:UI.quantity});break;
      case'technique':act('technique',{jobId:id});break;
      case'cancel':act('cancel',{jobId:id});break;
      case'attributes':openModal('attributes');break;
      case'allocate':act('allocate',{stat:id});renderModal();break;
      case'respec-confirm':openModal('respec-confirm');break;
      case'respec':if(act('respec').ok)UI.modal='attributes';renderModal();break;
      case'quarry-tab':UI.quarryTab=id;render();break;
      case'quarry-upgrade':act('quarryUpgrade',{upgradeId:id});break;
      case'quarry-worker':act('hireQuarryWorker',{workerId:id});break;
      case'mine':act('mine',{materialId:id});break;
      case'market':openModal('market');break;
      case'material':act('buyMaterial',{materialId:id,quantity:Number(el.dataset.quantity)||1});if(UI.modal)renderModal();break;
      case'sell-material':act('sellMaterial',{materialId:id,quantity:Number(el.dataset.quantity)||1});if(UI.modal)renderModal();break;
      case'item':UI.itemHero=UI.selectedHero;openModal('item',id);break;
      case'protect':act('protect',{itemId:id});if(UI.modal)renderModal();break;
      case'display':act('display',{itemId:id});renderModal();break;
      case'customer':UI.selectedHero=id;UI.itemHero=id;UI.view='inventory';UI.modal=null;render();renderModal();toast('Choose equipment for '+(s.adventurers.find(h=>h.id===id)?.name||'this customer')+'.');break;
      case'sell-equip':case'sell-send':if(act('sell',{itemId:id,heroId:UI.itemHero,dispatch:action==='sell-send'}).ok){UI.modal=null;renderModal();}break;
      case'gift':if(act('gift',{itemId:id,heroId:UI.itemHero}).ok){UI.modal=null;renderModal();}break;
      case'town':if(act('sell',{itemId:id,heroId:null,dispatch:false}).ok){UI.modal=null;renderModal();}break;
      case'salvage-confirm':UI.selectedItem=id;openModal('salvage-confirm');break;
      case'salvage':if(act('salvage',{itemId:id}).ok){UI.modal=null;renderModal();}break;
      case'enchant-menu':UI.selectedItem=id;openModal('enchant');break;
      case'enchant':if(act('enchant',{itemId:UI.selectedItem,enchantmentId:id}).ok)UI.modal='item';renderModal();break;
      case'hero':UI.heroQuest=s.adventurers.find(h=>h.id===id)?.questId;openModal('hero',id);break;
      case'hero-quest':{const h=s.adventurers.find(h=>h.id===id);UI.party=[id];openModal('quest',UI.heroQuest||h.questId);break;}
      case'quest':UI.party=[];openModal('quest',id);break;
      case'dispatch':if(act('dispatch',{questId:id,heroIds:UI.party}).ok){UI.modal=null;UI.selectedRun=s.runs[s.runs.length-1]?.id;UI.view='workshop';render();renderModal();}break;
      case'battle':openModal('battle',id);break;
      case'route':act('route',{questId:el.dataset.quest,choiceId:id});renderModal();break;
      case'upgrades-tab':UI.upgradesTab=id;render();break;
      case'upgrade':act('upgrade',{upgradeId:id});break;
      case'staff-hire':act('hireStaff',{staffId:id});break;
      case'staff-toggle':act('toggleStaff',{staffId:id});break;
      case'decorate':act('decorate',{decorId:id});break;
      case'talent':act('talent',{talentId:id});break;
      case'journal-tab':UI.journalTab=id;render();break;
      case'automation':openModal('automation');break;
      case'save-automation':{const payload={};document.querySelectorAll('[data-auto]').forEach(input=>payload[input.dataset.auto]=input.type==='checkbox'?input.checked:input.type==='number'?Number(input.value):input.value||null);if(act('automation',payload).ok){UI.modal=null;renderModal();}break;}
      case'retirement':openModal('retirement');break;
      case'confirm-retire':{const heirloomItemId=document.getElementById('heirloom-choice')?.value||null;if(act('retire',{heirloomItemId,confirmed:true}).ok){UI.modal=null;UI.selectedItem=null;UI.selectedHero=null;UI.selectedRun=null;UI.party=[];UI.view='legacy';if(!game.state.started)UI.modal='create';render();renderModal();}break;}
      case'mailbox':openModal('mailbox');break;
      case'claim':act('claim',{bundleId:id});renderModal();break;
      case'reclaim':act('reclaim');break;
      case'commission-accept':act('acceptCommission',{commissionId:id});break;
      case'commission-deliver':act('fulfillCommission',{commissionId:id,itemId:el.dataset.item});break;
      case'takeover':{const raw=storageGet(SAVE);if(raw){const result=game.importSave(raw);if(!result.ok){toast('The latest save could not be loaded. Export or reload before taking control.',true);break;}}claimLease(true);game.advanceOffline(Date.now());lastTick=Date.now();UI.modal=game.state.started?null:'create';save(true);render();renderModal();toast('This tab now controls the latest saved workshop.');break;}
      case'export':{save(true);const blob=new Blob([game.exportSave()],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ember-and-iron-generation-'+player().legacy.generation+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Save exported.');break;}
      case'import':document.getElementById('import-file').click();break;
      case'backup':{const raw=storageGet(BACKUP);const result=raw&&EIEngine.validateSave(raw,D);if(!result?.ok)toast('No valid backup is available.',true);else{UI.importText=raw;openModal('confirm-import');}break;}
      case'confirm-import':{if(UI.readOnly){toast('Take control of this tab first.',true);break;}const result=game.importSave(UI.importText);toast(result.message,!result.ok);if(result.ok){UI.modal=null;UI.view='workshop';UI.party=[];UI.selectedRun=null;lastTick=Date.now();game.advanceOffline(Date.now());save(true);render();renderModal();}break;}
    }
  });
  document.addEventListener('input',event=>{const el=event.target;if(el.dataset.input==='shopName')UI.setupName=el.value;if(el.dataset.input==='recipeSearch'){UI.search=el.value;render();}});
  document.addEventListener('change',event=>{const el=event.target,key=el.dataset.input;if(el.dataset.party){if(el.checked)UI.party.push(el.dataset.party);else UI.party=UI.party.filter(id=>id!==el.dataset.party);renderModal();return;}if(!key||!game)return;switch(key){case'classFilter':UI.classFilter=el.value;render();break;case'quantity':UI.quantity=Number(el.value);render();break;case'inventoryFilter':UI.inventoryFilter=el.value;render();break;case'watchedRun':UI.selectedRun=el.value;render();break;case'deposit':act('quarryDeposit',{materialId:el.value});break;case'itemHero':UI.itemHero=el.value;renderModal();break;case'heroQuest':UI.heroQuest=el.value;break;case'reduced':case'large':UI[key]=el.checked;document.body.classList.toggle(key==='reduced'?'reduce-motion':'large-text',el.checked);storageSet(SAVE+'-preferences',JSON.stringify({reduced:UI.reduced,large:UI.large}));break;}});
  document.getElementById('import-file').addEventListener('change',async event=>{const file=event.target.files?.[0];if(!file)return;if(file.size>12000000){toast('That save file is too large.',true);return;}const text=await file.text();const result=EIEngine.validateSave(text,D);if(!result.ok){toast(result.message,true);return;}UI.importText=text;openModal('confirm-import');event.target.value='';});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.modal&&UI.modal!=='create'){UI.modal=null;renderModal();}if(e.key==='Tab'&&UI.modal){const modal=document.querySelector('.modal'),nodes=modal?.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),a[href]');if(!nodes?.length)return;const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
  window.addEventListener('storage',e=>{if(e.key===LEASE){let lease;try{lease=JSON.parse(e.newValue||'null');}catch(_){}if(lease&&lease.owner!==owner){UI.readOnly=true;leaseOwned=false;UI.force=true;}}});
  window.addEventListener('pagehide',()=>{save(true);if(leaseOwned){try{const lease=JSON.parse(localStorage.getItem(LEASE)||'null');if(lease?.owner===owner)localStorage.removeItem(LEASE);}catch(_){}}});
  document.addEventListener('visibilitychange',()=>save(true));
  init();
})();


</script>
</body>
</html>
